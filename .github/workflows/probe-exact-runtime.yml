name: Probe Exact Runtime Source

on:
  push:
    branches: [feat/exact-chart-runtime-source]
    paths: [.github/workflows/probe-exact-runtime.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download pinned corpus and locate m0049 expert
        run: |
          URL='https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json'
          curl --fail --location --silent --show-error -o /tmp/corpus.json "$URL"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('/tmp/corpus.json', 'utf8');
          const arrayMatch = /"charts"\s*:\s*\[/.exec(text);
          if (!arrayMatch) throw new Error('charts array not found');
          let cursor = arrayMatch.index + arrayMatch[0].length;
          let found = null;
          while (cursor < text.length) {
            while (cursor < text.length && /[\s,]/.test(text[cursor])) cursor += 1;
            if (text[cursor] === ']') break;
            if (text[cursor] !== '{') throw new Error(`expected chart object at ${cursor}`);
            const start = cursor;
            let depth = 0;
            let inString = false;
            let escaped = false;
            let end = -1;
            for (; cursor < text.length; cursor += 1) {
              const ch = text[cursor];
              if (inString) {
                if (escaped) escaped = false;
                else if (ch === '\\') escaped = true;
                else if (ch === '"') inString = false;
                continue;
              }
              if (ch === '"') { inString = true; continue; }
              if (ch === '{') depth += 1;
              else if (ch === '}') {
                depth -= 1;
                if (depth === 0) { end = cursor; cursor += 1; break; }
              }
            }
            if (end < 0) throw new Error('unterminated chart object');
            const fragment = text.slice(start, end + 1);
            const obj = JSON.parse(fragment);
            if (obj.songId === 'm0049' && String(obj.difficulty).toLowerCase() === 'expert') {
              found = { start, end, obj };
              break;
            }
          }
          if (!found) throw new Error('fixture chart not found');
          const bytesBefore = Buffer.byteLength(text.slice(0, found.start), 'utf8');
          const bytesObject = Buffer.byteLength(text.slice(found.start, found.end + 1), 'utf8');
          fs.writeFileSync('/tmp/range.env', `START=${bytesBefore}\nEND=${bytesBefore + bytesObject - 1}\nLENGTH=${bytesObject}\n`);
          console.log(JSON.stringify({ songId: found.obj.songId, difficulty: found.obj.difficulty, start: bytesBefore, end: bytesBefore + bytesObject - 1, length: bytesObject, events: found.obj.events.length }));
          NODE
          cat /tmp/range.env
      - name: Probe raw GitHub identity Range and CORS
        run: |
          set -a; . /tmp/range.env; set +a
          URL='https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json'
          curl --fail --silent --show-error --dump-header /tmp/headers.txt -H "Range: bytes=${START}-${END}" -o /tmp/range.bin "$URL"
          cat /tmp/headers.txt
          test "$(wc -c < /tmp/range.bin)" -eq "$LENGTH"
          grep -Eiq '^access-control-allow-origin: \*' /tmp/headers.txt
          grep -Eiq '^content-range: bytes ' /tmp/headers.txt
      - name: Probe Node fetch with automatic Accept-Encoding
        run: |
          set -a; . /tmp/range.env; set +a
          node --input-type=module <<'NODE'
          const start = Number(process.env.START);
          const end = Number(process.env.END);
          const length = Number(process.env.LENGTH);
          const url = 'https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json';
          const response = await fetch(url, { headers: { Range: `bytes=${start}-${end}` } });
          console.log(JSON.stringify({ status: response.status, contentRange: response.headers.get('content-range'), contentEncoding: response.headers.get('content-encoding'), cors: response.headers.get('access-control-allow-origin') }));
          if (response.status !== 206) throw new Error(`Node fetch range status ${response.status}`);
          const text = await response.text();
          if (Buffer.byteLength(text) !== length) throw new Error(`Node fetch length ${Buffer.byteLength(text)} != ${length}`);
          const obj = JSON.parse(text);
          if (obj.songId !== 'm0049' || obj.events?.length !== 720) throw new Error('Node fetch range payload mismatch');
          NODE
      - name: Probe jsDelivr compressed Range
        run: |
          set -a; . /tmp/range.env; set +a
          URL='https://cdn.jsdelivr.net/gh/asciisyaez/yagoo-dori@6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json'
          curl --fail --silent --show-error --compressed --dump-header /tmp/jsd-headers.txt -H "Range: bytes=${START}-${END}" -o /tmp/jsd-range.bin "$URL"
          cat /tmp/jsd-headers.txt
          test "$(wc -c < /tmp/jsd-range.bin)" -eq "$LENGTH"
          grep -Eiq '^access-control-allow-origin: \*' /tmp/jsd-headers.txt
          grep -Eiq '^content-range: bytes ' /tmp/jsd-headers.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const obj = JSON.parse(fs.readFileSync('/tmp/jsd-range.bin', 'utf8'));
          if (obj.songId !== 'm0049' || obj.events?.length !== 720) throw new Error('jsDelivr range payload mismatch');
          console.log('jsDelivr compressed range parse OK');
          NODE
