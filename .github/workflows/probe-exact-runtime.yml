name: Probe Exact Runtime Source

on:
  push:
    branches: [feat/exact-chart-runtime-source]
    paths: [.github/workflows/probe-exact-runtime.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download pinned corpus and locate m0049 expert
        run: |
          URL='https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json'
          curl --fail --location --silent --show-error -o /tmp/corpus.json "$URL"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('/tmp/corpus.json', 'utf8');
          const arrayMatch = /"charts"\s*:\s*\[/.exec(text);
          if (!arrayMatch) throw new Error('charts array not found');
          let cursor = arrayMatch.index + arrayMatch[0].length;
          let found = null;
          while (cursor < text.length) {
            while (cursor < text.length && /[\s,]/.test(text[cursor])) cursor += 1;
            if (text[cursor] === ']') break;
            if (text[cursor] !== '{') throw new Error(`expected chart object at ${cursor}`);
            const start = cursor;
            let depth = 0;
            let inString = false;
            let escaped = false;
            let end = -1;
            for (; cursor < text.length; cursor += 1) {
              const ch = text[cursor];
              if (inString) {
                if (escaped) escaped = false;
                else if (ch === '\\') escaped = true;
                else if (ch === '"') inString = false;
                continue;
              }
              if (ch === '"') { inString = true; continue; }
              if (ch === '{') depth += 1;
              else if (ch === '}') {
                depth -= 1;
                if (depth === 0) { end = cursor; cursor += 1; break; }
              }
            }
            if (end < 0) throw new Error('unterminated chart object');
            const fragment = text.slice(start, end + 1);
            const obj = JSON.parse(fragment);
            if (obj.songId === 'm0049' && String(obj.difficulty).toLowerCase() === 'expert') {
              found = { start, end, obj };
              break;
            }
          }
          if (!found) throw new Error('fixture chart not found');
          const bytesBefore = Buffer.byteLength(text.slice(0, found.start), 'utf8');
          const bytesObject = Buffer.byteLength(text.slice(found.start, found.end + 1), 'utf8');
          fs.writeFileSync('/tmp/range.env', `START=${bytesBefore}\nEND=${bytesBefore + bytesObject - 1}\nLENGTH=${bytesObject}\n`);
          console.log(JSON.stringify({ songId: found.obj.songId, difficulty: found.obj.difficulty, start: bytesBefore, end: bytesBefore + bytesObject - 1, length: bytesObject, events: found.obj.events.length }));
          NODE
          cat /tmp/range.env
      - name: Probe Range and CORS headers
        run: |
          set -a; . /tmp/range.env; set +a
          URL='https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json'
          curl --fail --silent --show-error --dump-header /tmp/headers.txt -H "Range: bytes=${START}-${END}" -o /tmp/range.bin "$URL"
          cat /tmp/headers.txt
          test "$(wc -c < /tmp/range.bin)" -eq "$LENGTH"
          grep -Eiq '^access-control-allow-origin: \*' /tmp/headers.txt
          grep -Eiq '^content-range: bytes ' /tmp/headers.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const obj = JSON.parse(fs.readFileSync('/tmp/range.bin', 'utf8'));
          if (obj.songId !== 'm0049' || String(obj.difficulty).toLowerCase() !== 'expert' || obj.events?.length !== 720) throw new Error('range payload mismatch');
          console.log(`range parse OK: ${obj.songId}:${obj.difficulty}, ${obj.events.length} events`);
          NODE
      - name: Probe browser-like Accept-Encoding behavior
        run: |
          set -a; . /tmp/range.env; set +a
          URL='https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json'
          curl --fail --silent --show-error --compressed --dump-header /tmp/compressed-headers.txt -H "Range: bytes=${START}-${END}" -o /tmp/compressed-range.bin "$URL"
          cat /tmp/compressed-headers.txt
          test "$(wc -c < /tmp/compressed-range.bin)" -eq "$LENGTH"
          grep -Eiq '^content-range: bytes ' /tmp/compressed-headers.txt
          if grep -Eiq '^content-encoding:' /tmp/compressed-headers.txt; then
            echo 'Range response used content encoding; browser byte offsets may be unsafe.' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const obj = JSON.parse(fs.readFileSync('/tmp/compressed-range.bin', 'utf8'));
          if (obj.songId !== 'm0049' || obj.events?.length !== 720) throw new Error('compressed range payload mismatch');
          console.log('compressed-request range parse OK');
          NODE
