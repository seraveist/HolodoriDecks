name: Probe Exact Runtime Source

on:
  push:
    branches: [feat/exact-chart-runtime-source]
    paths: [.github/workflows/probe-exact-runtime.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download pinned corpus and locate m0049 expert
        run: |
          URL='https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json'
          curl --fail --location --silent --show-error -o /tmp/corpus.json "$URL"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = '/tmp/corpus.json';
          const text = fs.readFileSync(file, 'utf8');
          const needle = '"key":"m0049:expert"';
          const keyPos = text.indexOf(needle);
          if (keyPos < 0) throw new Error('fixture key not found');
          let start = keyPos;
          while (start >= 0 && text[start] !== '{') start -= 1;
          if (start < 0) throw new Error('object start not found');
          let depth = 0;
          let inString = false;
          let escaped = false;
          let end = -1;
          for (let i = start; i < text.length; i += 1) {
            const ch = text[i];
            if (inString) {
              if (escaped) escaped = false;
              else if (ch === '\\') escaped = true;
              else if (ch === '"') inString = false;
              continue;
            }
            if (ch === '"') { inString = true; continue; }
            if (ch === '{') depth += 1;
            else if (ch === '}') {
              depth -= 1;
              if (depth === 0) { end = i; break; }
            }
          }
          if (end < 0) throw new Error('object end not found');
          const bytesBefore = Buffer.byteLength(text.slice(0, start), 'utf8');
          const bytesObject = Buffer.byteLength(text.slice(start, end + 1), 'utf8');
          fs.writeFileSync('/tmp/range.env', `START=${bytesBefore}\nEND=${bytesBefore + bytesObject - 1}\nLENGTH=${bytesObject}\n`);
          const obj = JSON.parse(text.slice(start, end + 1));
          console.log(JSON.stringify({ key: obj.key, start: bytesBefore, end: bytesBefore + bytesObject - 1, length: bytesObject, events: obj.events.length }));
          NODE
          cat /tmp/range.env
      - name: Probe Range and CORS headers
        run: |
          set -a; . /tmp/range.env; set +a
          URL='https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json'
          curl --fail --silent --show-error --dump-header /tmp/headers.txt -H "Range: bytes=${START}-${END}" -o /tmp/range.bin "$URL"
          cat /tmp/headers.txt
          test "$(wc -c < /tmp/range.bin)" -eq "$LENGTH"
          grep -Eiq '^access-control-allow-origin: \*' /tmp/headers.txt
          grep -Eiq '^content-range: bytes ' /tmp/headers.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const obj = JSON.parse(fs.readFileSync('/tmp/range.bin', 'utf8'));
          if (obj.key !== 'm0049:expert' || obj.events?.length !== 720) throw new Error('range payload mismatch');
          console.log(`range parse OK: ${obj.key}, ${obj.events.length} events`);
          NODE
