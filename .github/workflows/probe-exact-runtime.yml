name: Build Exact Runtime Index

on:
  push:
    branches: [feat/exact-chart-runtime-source]
    paths:
      - scripts/build-exact-runtime-index.mjs
      - scripts/test-exact-runtime-source.mjs
      - js/chart-data.js
      - .github/workflows/probe-exact-runtime.yml

permissions:
  contents: write

concurrency:
  group: exact-runtime-index-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exact-chart-runtime-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download pinned public corpus
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            -o /tmp/holodori-chart-timelines.json \
            https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json
          test -s /tmp/holodori-chart-timelines.json
      - name: Build current-Master runtime range index
        run: |
          node scripts/build-exact-runtime-index.mjs --input /tmp/holodori-chart-timelines.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const index = JSON.parse(await readFile('data/generated/exact-runtime-index.json', 'utf8'));
          if (index.runtimeExactCount !== 703) throw new Error(`expected 703 runtime exact charts, got ${index.runtimeExactCount}`);
          if (index.currentMasterChartCount !== 728) throw new Error(`expected 728 Master charts, got ${index.currentMasterChartCount}`);
          if (index.unavailableCount !== 25) throw new Error(`expected 25 unavailable charts, got ${index.unavailableCount}`);
          if (index.rejectedAvailableCount !== 0) throw new Error(`runtime index rejected ${index.rejectedAvailableCount} available charts`);
          console.log(`runtime exact index OK: ${index.runtimeExactCount}/${index.currentMasterChartCount}`);
          NODE
      - name: Test runtime conversion and loader
        run: |
          node scripts/test-exact-runtime-source.mjs
          node --check scripts/build-exact-runtime-index.mjs
          node --check js/chart-data.js
      - name: Exercise real pinned range through loadSelectedChart
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { loadSelectedChart } from './js/chart-data.js';
          const chartIndex = JSON.parse(await readFile('data/generated/chart-index.json', 'utf8'));
          const runtimeIndex = JSON.parse(await readFile('data/generated/exact-runtime-index.json', 'utf8'));
          const resources = {
            version: chartIndex.source_commit,
            chartsByKey: new Map(Object.entries(chartIndex.charts)),
            runtimeIndex,
            runtimeChartsByKey: new Map(Object.entries(runtimeIndex.charts)),
          };
          const result = await loadSelectedChart(resources, 'm0001', 'EASY');
          if (!result?.metadata?.sourceRuntime) throw new Error('m0001:EASY did not load runtime Exact metadata');
          if (result.metadata.notes.length !== result.fullComboNoteCount) throw new Error('runtime Exact note count mismatch');
          if (result.metadata.skills.length !== 5) throw new Error('runtime Exact SP marker count mismatch');
          console.log(`live loader OK: m0001:EASY ${result.metadata.notes.length} notes`);
          NODE
      - name: Bust chart loader cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          old = './chart-data.js?v=20260812.4'
          new = './chart-data.js?v=20260813.3'
          if old in text:
              text = text.replace(old, new)
              app.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('unexpected chart-data cache key')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = './js/app.js?v=20260813.2'
          new = './js/app.js?v=20260813.3'
          if old in text:
              text = text.replace(old, new)
              index.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('unexpected app cache key')
          PY
      - name: Commit generated range index and cache keys
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/exact-runtime-index.json js/app.js index.html
          if git diff --cached --quiet; then
            echo "Runtime integration files unchanged."
            exit 0
          fi
          git commit -m "Finalize exact runtime source integration"
          git push origin HEAD:feat/exact-chart-runtime-source
