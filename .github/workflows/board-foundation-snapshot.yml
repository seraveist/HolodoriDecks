name: Board foundation development snapshot
on:
  push:
    branches: [feature/member-board-ui]
    paths: [.github/workflows/board-foundation-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked source and pinned public Master inputs
        shell: bash
        run: |
          mkdir -p /tmp/board-foundation-snapshot/master
          git archive --format=tar HEAD -o /tmp/board-foundation-snapshot/source.tar
          python - <<'PY'
          import concurrent.futures, json, pathlib, time, urllib.request
          meta = json.loads(pathlib.Path('data/upstream.json').read_text())
          core = set(meta['files']) | set('SkillTreeNodePosition SkillTreeNode SkillTreeEffect SkillTreeEffectTarget SkillTreeEffectPassiveTrigger SkillTreeEffectValueLimit SkillTreeConnectEffect SkillTreeConnectEffectExtent PosterCollectEffect Condition Item CharacterGrouping CharacterLevel SkillTreePoint LiveActiveSkill Setting MusicDifficulty LiveNote LiveCombo LiveNoteJudgementTechnicalScore'.split())
          core = {name if '.' in name else name + '.json' for name in core}
          languages = 'LangSkillTreeEffect LangGeneratedSkillTreeEffect LangGeneratedSkillTreeEffectTarget LangGeneratedSkillTreeEffectPassiveTrigger LangGeneratedSkillTreeConnectEffect LangCondition LangItem LangCharacterGrouping LangSkillTreePoint LangPoster LangCard LangCharacter LangMusic LangGeneratedLiveLeaderSkill LangGeneratedLiveActiveSkillLevel LangGeneratedLiveActiveSkillEffect LangGeneratedLivePassiveSkillLevel LangGeneratedLivePassiveSkillEffect LangGeneratedLiveSpecialSkillLevel LangGeneratedLiveSkillTrigger LangGeneratedLiveSkillEffectTarget LangClientCommon LangTipsDetail LangHelpContent'.split()
          tasks = [(meta['repository'], meta['commit'], name, 'core') for name in sorted(core)]
          for locale, config in meta['locales'].items():
              tasks += [(config['repository'], config['commit'], name + '_' + config['suffix'] + '.json', locale) for name in languages]
          def download(task):
              repo, commit, name, folder = task
              target = pathlib.Path('/tmp/board-foundation-snapshot/master') / folder / name
              target.parent.mkdir(parents=True, exist_ok=True)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen('https://raw.githubusercontent.com/' + repo + '/' + commit + '/' + name, timeout=45) as response:
                          target.write_bytes(response.read())
                      return
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(attempt + 1)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(download, tasks))
          print('Pinned source:', meta['commit'], 'downloaded files:', len(tasks))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: board-foundation-snapshot
          path: /tmp/board-foundation-snapshot/
          retention-days: 1
          if-no-files-found: error
