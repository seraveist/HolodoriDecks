name: Sync Holodori card assets

on:
  push:
    branches: [main]
    paths:
      - "data/generated/cards.json"
      - "src/holodori_decksim/card_assets.py"
      - "src/holodori_decksim/public_card_art.py"
      - "src/holodori_decksim/automation_gate.py"
      - "scripts/sync-card-assets.py"
      - "scripts/check-automation-gate.py"
      - "scripts/ensure-pages-deployment.py"
      - ".github/workflows/sync-card-assets.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve and validate missing/repairable portraits without pushing a branch or PR
        required: false
        default: false
        type: boolean
      auto_merge:
        description: Automatically merge a validated, non-anomalous asset PR
        required: false
        default: true
        type: boolean
  schedule:
    # 11:00 and 23:00 KST every day (02:00 and 14:00 UTC).
    - cron: "0 2,14 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: holodori-card-asset-sync
  cancel-in-progress: false

env:
  ASSET_TOOL_REPOSITORY: HolodoriDB/holodori-asset-tools
  ASSET_TOOL_COMMIT: 13f150fe9dfbd367be53e5ea1c0a4ceb258b74f2

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Diagnose Python installer
        run: |
          python --version
          python -m pip --version

      - name: Install core project tooling
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -e '.[test]' Pillow; then
              exit 0
            fi
            echo "::warning::Core project tooling install failed (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Install pinned asset tooling
        # The public snapshot only needs Pillow. A broken optional Octo install
        # must not discard images that the primary source can already provide.
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 5 --timeout 30 \
              "git+https://github.com/${ASSET_TOOL_REPOSITORY}.git@${ASSET_TOOL_COMMIT}"; then
              exit 0
            fi
            echo "::warning::Pinned asset tooling install failed (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Validate card asset sync helpers
        run: |
          python -m pytest -q tests/test_card_assets.py tests/test_public_card_art.py tests/test_card_asset_sync.py tests/test_automation_gate.py tests/test_pages_deployment.py
          python -m py_compile \
            src/holodori_decksim/card_assets.py \
            src/holodori_decksim/public_card_art.py \
            src/holodori_decksim/automation_gate.py \
            scripts/sync-card-assets.py \
            scripts/check-automation-gate.py

      - name: Audit missing selectable-card portraits
        id: audit
        run: |
          python scripts/sync-card-assets.py --report /tmp/card-asset-audit.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          report = json.load(open('/tmp/card-asset-audit.json', encoding='utf-8'))
          print(f"missing_count={report['missing_count']}")
          print("missing_ids=" + ",".join(item['id'] for item in report['missing']))
          PY

      - name: Resolve, download, extract, normalize, and repair portraits
        id: sync_assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/sync-card-assets.py \
            --sync \
            --catalog-cache /tmp/holodori-octo-list.json \
            --provenance assets/card-portrait-sync.json \
            --report /tmp/card-asset-sync.json
          sync_status=$?
          set -e

          if [ ! -f /tmp/card-asset-sync.json ]; then
            echo "::error::Card asset sync exited ${sync_status} without producing a report."
            exit 1
          fi

          SYNC_STATUS="$sync_status" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          report = json.load(open('/tmp/card-asset-sync.json', encoding='utf-8'))
          unresolved = list(report.get('unresolved', []))
          pending = [item for item in unresolved if item['status'] == 'pending']
          errors = [item for item in unresolved if item['status'] == 'error']
          if len(pending) + len(errors) != len(unresolved):
              raise SystemExit('Unknown unresolved portrait status')

          print(f"imported_count={report.get('imported_count', 0)}")
          print(f"repair_count={report.get('public_repair_count', 0)}")
          print(f"unresolved_count={len(unresolved)}")
          print(f"pending_count={len(pending)}")
          print(f"error_count={len(errors)}")
          print(f"catalog_revision={report.get('catalog_revision', 0)}")
          print("imported_ids=" + ",".join(item['id'] for item in report.get('imported', [])))
          print("pending_ids=" + ",".join(item['id'] for item in pending))
          print("error_ids=" + ",".join(item['id'] for item in errors))

          status = int(os.environ.get('SYNC_STATUS', '1'))
          if status not in (0, 1, 2) or (status == 1 and not errors):
              raise SystemExit(status or 1)
          PY

          if [ "$sync_status" -eq 2 ]; then
            echo "::notice::Some portraits are still unavailable; publishing verified images and retrying the remaining cards on the next scheduled run."
          fi

      - name: Validate resolved portrait outputs
        run: |
          python scripts/validate-generated-data.py
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          report = json.load(open('/tmp/card-asset-sync.json', encoding='utf-8'))
          for row in report['imported']:
              path = Path('assets/cards') / f"{row['id']}.webp"
              with Image.open(path) as image:
                  if image.format != 'WEBP':
                      raise SystemExit(f"not WebP: {path}")
                  if image.width < 128 or image.height < 128:
                      raise SystemExit(f"portrait unexpectedly small: {path} {image.size}")
                  if image.width > 768 or image.height > 768:
                      raise SystemExit(f"portrait exceeds normalized bounds: {path} {image.size}")
                  if row.get('asset_class') == 'card-illustration' and image.width <= image.height:
                      raise SystemExit(f"synced illustration is not landscape: {path} {image.size}")
          print(f"validated {len(report['imported'])} imported/repaired WebP portraits")
          PY

      - name: Validate completed portrait set
        if: steps.sync_assets.outputs.unresolved_count == '0'
        run: python scripts/sync-card-assets.py --require-complete

      - name: Detect asset diff
        id: diff
        run: |
          git add -- assets/cards assets/card-portrait-sync.json
          git diff --cached --name-status > /tmp/card-asset-diff.txt
          git status --porcelain -- assets/cards assets/card-portrait-sync.json
          if [ -n "$(git status --porcelain -- assets/cards assets/card-portrait-sync.json)" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate card-asset auto-merge safety
        id: gate
        run: |
          python scripts/check-automation-gate.py card-assets \
            --report /tmp/card-asset-sync.json \
            --diff /tmp/card-asset-diff.txt \
            --output /tmp/card-asset-automerge-gate.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          gate = json.load(open('/tmp/card-asset-automerge-gate.json', encoding='utf-8'))
          print(f"safe={str(bool(gate['safe'])).lower()}")
          print(f"reason_count={len(gate['reasons'])}")
          PY

      - name: Show dry-run summary
        if: steps.diff.outputs.has_diff == 'true' && inputs.dry_run == true
        run: |
          git status --short -- assets/cards assets/card-portrait-sync.json
          git diff --cached --stat -- assets/cards assets/card-portrait-sync.json
          if [ -f /tmp/card-asset-automerge-gate.json ]; then
            cat /tmp/card-asset-automerge-gate.json
          fi
          cat /tmp/card-asset-sync.json

      - name: Commit asset sync branch
        id: asset_commit
        if: >-
          steps.diff.outputs.has_diff == 'true' &&
          inputs.dry_run != true
        env:
          SYNC_BRANCH: automation/card-asset-sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add assets/cards assets/card-portrait-sync.json
          git commit -m "Sync Holodori card portraits"
          git push --force origin "$SYNC_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or refresh card asset pull request
        id: asset_pr
        if: >-
          steps.diff.outputs.has_diff == 'true' &&
          inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/card-asset-sync
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/card-asset-sync.json').read_text(encoding='utf-8'))
          gate = json.loads(Path('/tmp/card-asset-automerge-gate.json').read_text(encoding='utf-8'))
          imported = report.get('imported', [])
          rows = '\n'.join(
              f"- `{row['id']}` ← `{row['asset_id']}` ({row['unity_object_type']} `{row['unity_object']}`)"
              for row in imported
          ) or '- none'
          if gate['safe']:
              gate_text = '- Status: **eligible for automatic merge**\n- All portrait safety checks passed.'
          else:
              reasons = '\n'.join(f"- {reason}" for reason in gate['reasons'])
              gate_text = f'- Status: **manual review required**\n{reasons}'
          body = f"""## Automated Holodori card portrait sync

          This PR contains verified portraits for the current `main` card Master. Safe partial batches are automatically merged; remaining cards are retried independently. Anomalous output changes remain open for administrator review.

          - Public source: `{report.get('public_source_repository')}`@`{report.get('public_source_commit')}`
          - Public repairs: {report.get('public_repair_count', 0)}
          - Octo fallback tool: `{report['asset_tool_repository']}@{report['asset_tool_commit']}`
          - Octo catalog revision: `{report['catalog_revision']}`
          - Missing before sync: {report['before']['missing_count']}
          - Imported/repaired: {report['imported_count']}
          - Missing after sync: {report['after']['missing_count']}
          - Pending retry: {report['pending_count']}
          - Failed cards: {report['error_count']}

          ### Automatic merge gate
          {gate_text}

          ### Imported / repaired portraits
          {rows}

          ### Validation
          - only ★4/★5 cards are portrait targets
          - original bootstrap portraits are not overwritten by routine sync
          - wrong-class public snapshot icons may be repaired to landscape illustrations
          - automated outputs are validated WebP within 768×768
          - public snapshot illustrations must remain landscape
          - staged WebP paths must exactly match successful imports
          - unresolved cards do not block verified images or Master-data deployment
          - source/output dimensions and SHA-256 provenance are recorded
          """
          Path('/tmp/card-asset-pr-body.md').write_text(
              '\n'.join(line.strip() for line in body.splitlines()) + '\n',
              encoding='utf-8',
          )
          PY

          title="Sync Holodori card portraits (${{ steps.sync_assets.outputs.imported_count }} images)"
          number="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file /tmp/card-asset-pr-body.md
            state=updated
          else
            output="$(gh pr create --base main --head "$SYNC_BRANCH" --title "$title" --body-file /tmp/card-asset-pr-body.md)"
            echo "$output"
            state=created
            number="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          test -n "$number"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Auto-merge safe card asset sync
        id: auto_merge
        if: >-
          steps.diff.outputs.has_diff == 'true' &&
          inputs.dry_run != true &&
          steps.gate.outputs.safe == 'true' &&
          steps.asset_pr.outputs.number != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.auto_merge == true)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.asset_pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.asset_commit.outputs.head_sha }}
        run: |
          actual_head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          test "$actual_head" = "$EXPECTED_HEAD"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" \
            -f state=success -f context=validate \
            -f description="Card asset validation and safety gate passed for this commit" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$EXPECTED_HEAD"
          test "$(gh pr view "$PR_NUMBER" --json state --jq '.state')" = "MERGED"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Deploy merged portraits or retry an outstanding deployment
        id: pages
        if: >-
          inputs.dry_run != true &&
          (github.event_name != 'workflow_dispatch' || inputs.auto_merge == true) &&
          (steps.auto_merge.outputs.merged == 'true' || steps.diff.outputs.has_diff == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ensure-pages-deployment.py

      - name: Flag anomaly for administrator review
        if: >-
          steps.diff.outputs.has_diff == 'true' &&
          steps.gate.outputs.safe == 'false'
        run: |
          echo "::warning::Card asset sync completed but tripped the automatic-merge anomaly gate. PR #${{ steps.asset_pr.outputs.number }} remains open for administrator review."
          cat /tmp/card-asset-automerge-gate.json

      - name: Report source failures after publishing verified portraits
        if: steps.sync_assets.outputs.error_count != '0'
        run: |
          echo "::error::Some portraits failed to synchronize. Verified images have been processed; failed cards will be retried and do not block Master data."
          cat /tmp/card-asset-sync.json
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Holodori card asset sync"
            echo "- physically missing before: ${{ steps.audit.outputs.missing_count || 'unknown' }}"
            echo "- imported/repaired: ${{ steps.sync_assets.outputs.imported_count || '0' }}"
            echo "- public repairs: ${{ steps.sync_assets.outputs.repair_count || '0' }}"
            echo "- pending publication: ${{ steps.sync_assets.outputs.pending_count || '0' }}"
            echo "- actual errors: ${{ steps.sync_assets.outputs.error_count || '0' }}"
            echo "- unresolved total: ${{ steps.sync_assets.outputs.unresolved_count || '0' }}"
            echo "- pending ids: ${{ steps.sync_assets.outputs.pending_ids || 'none' }}"
            echo "- error ids: ${{ steps.sync_assets.outputs.error_ids || 'none' }}"
            echo "- generated diff: ${{ steps.diff.outputs.has_diff || 'false' }}"
            echo "- auto-merge safe: ${{ steps.gate.outputs.safe || 'n/a' }}"
            echo "- auto-merged: ${{ steps.auto_merge.outputs.merged || 'false' }}"
            echo "- asset PR: ${{ steps.asset_pr.outputs.number || 'not-needed' }}"
            echo "- Pages dispatch: ${{ steps.pages.outputs.dispatched || 'false' }}"
            echo "- dry run: ${{ inputs.dry_run || false }}"
          } >> "$GITHUB_STEP_SUMMARY"
