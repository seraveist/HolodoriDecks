name: Optimizer Perf Patch

on:
  push:
    branches: [perf/preset-inclusion-and-scoring-cache]
    paths:
      - .github/workflows/optimizer-perf-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/preset-inclusion-and-scoring-cache
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create benchmark
        run: |
          cat > optimizer-bench.mjs <<'NODE'
          import fs from 'node:fs';
          import { performance } from 'node:perf_hooks';
          import { prepareScoreCards } from './js/score.js';
          import { optimizeOwnedDeck } from './js/recommend.js';
          import { optimizeRecommendationOrders } from './js/order.js';

          const cards = JSON.parse(fs.readFileSync('./data/generated/cards.json', 'utf8'));
          const characters = JSON.parse(fs.readFileSync('./data/generated/characters.json', 'utf8'));
          const music = JSON.parse(fs.readFileSync('./data/generated/music.json', 'utf8'));
          const chartIndex = JSON.parse(fs.readFileSync('./data/generated/chart-index.json', 'utf8'));
          const scoreRules = JSON.parse(fs.readFileSync('./data/generated/live-score-rules.json', 'utf8'));
          const exactMetadata = JSON.parse(fs.readFileSync('./data/generated/charts/m0049-EXPERT.json', 'utf8'));
          const charactersById = new Map(characters.map((row) => [row.id, row]));
          const settings = Object.fromEntries(cards.map((card) => [card.id, {
            level: Math.max(1, ...(card.growth?.levels ?? []).map((row) => Number(row.level) || 1)),
            potential: 0,
          }]));
          const prepared = prepareScoreCards(cards, charactersById, settings, { levelMode: 'max' });
          const selectable = cards.filter((card) => Number(card.rarity) >= 4 && prepared.has(card.id));
          const leaderCard = selectable.find((card) => {
            const row = prepared.get(card.id);
            return row?.raw?.leader && row.leader.primaryCondition.length === 0;
          }) ?? selectable.find((card) => prepared.get(card.id)?.raw?.leader);
          if (!leaderCard) throw new Error('benchmark leader not found');
          const ownedIds = [leaderCard.id, ...selectable.filter((card) => card.id !== leaderCard.id).slice(0, 35).map((card) => card.id)];
          const songBase = music.find((row) => row.id === 'm0049');
          const chartEntry = chartIndex.charts['m0049:EXPERT'];
          const searchMusic = { ...songBase, _chart: { ...chartEntry, metadata: null }, _scoreRules: scoreRules };
          const exactMusic = { ...songBase, _chart: { ...chartEntry, metadata: exactMetadata }, _scoreRules: scoreRules };
          const currentMembers = [leaderCard.id, null, null, null, null, null];
          const lockedSlots = [true, false, false, false, false, false];

          const started = performance.now();
          const result = optimizeOwnedDeck({
            preparedCards: prepared,
            ownedCardIds: ownedIds,
            currentMembers,
            lockedSlots,
            music: searchMusic,
            difficulty: 'EXPERT',
            playMode: 'manual',
            simulationTarget: 'score',
            separateRole: true,
            resultCount: 10,
          });
          const searchMs = performance.now() - started;
          if (!result.ok) throw new Error(result.reason);
          const orderStarted = performance.now();
          const ordered = optimizeRecommendationOrders({
            recommendation: result,
            preparedCards: prepared,
            currentMembers,
            lockedSlots,
            music: exactMusic,
            difficulty: 'EXPERT',
            playMode: 'manual',
            simulationTarget: 'score',
            separateRole: true,
            resultCount: 5,
          });
          const orderMs = performance.now() - orderStarted;
          console.log(JSON.stringify({
            searchMs: Math.round(searchMs),
            orderMs: Math.round(orderMs),
            searchEvaluated: result.evaluatedCount,
            orderEvaluated: ordered.orderOptimization?.evaluatedCount ?? 0,
            searchMode: result.searchMode,
          }));
          NODE

      - name: Benchmark before
        run: node optimizer-bench.mjs | tee /tmp/before.txt

      - name: Apply patches
        run: python .github/optimizer-perf-patch.py

      - name: Syntax and regression tests
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/test-chart-scoring.mjs

      - name: Benchmark after
        run: |
          node optimizer-bench.mjs | tee /tmp/after.txt
          echo '=== BEFORE ==='
          cat /tmp/before.txt
          echo '=== AFTER ==='
          cat /tmp/after.txt

      - name: Commit optimized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm optimizer-bench.mjs
          git rm .github/workflows/optimizer-perf-patch.yml .github/optimizer-perf-patch.py
          git add js index.html scripts/test-chart-scoring.mjs
          git commit -m 'Optimize preset inclusion and scoring search'
          git push origin HEAD:perf/preset-inclusion-and-scoring-cache
