name: Typography Unification Patch

on:
  push:
    branches:
      - ui/typography-unification
    paths:
      - .github/workflows/typography-unification.yml
      - .github/typography_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/typography-unification
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply typography patch
        run: python .github/typography_patch.py

      - name: Validate typography and app
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/test-chart-scoring.mjs
          python scripts/validate-generated-data.py
          grep -q 'pretendardvariable-dynamic-subset.min.css' index.html
          grep -q 'typography.css?v=20260813.1' index.html
          grep -q 'styles.css?v=20260812.5' index.html
          grep -q 'app.js?v=20260813.2' index.html
          grep -q 'card-copy-character' js/ui/cards.js
          grep -q 'card-copy-name' js/ui/modal.js
          grep -q 'card-copy-name' js/ui/owned.js
          grep -q 'card-copy-character' js/ui/result.js
          grep -q -- '--type-card-title: 13px' css/typography.css
          grep -q -- '--type-card-name: 11px' css/typography.css
          grep -q -- '--type-card-meta: 10px' css/typography.css
          if grep -R --include='*.css' -q 'font-size: 9px' css; then exit 1; fi
          if grep -R --include='*.css' -q 'font-weight: 900' css; then exit 1; fi
          if grep -q -- '-webkit-font-smoothing: antialiased' css/base.css; then exit 1; fi

      - name: Commit typography implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/typography-unification.yml .github/typography_patch.py
          git add index.html css js
          git commit -m 'Unify typography and card text hierarchy'
          git push origin HEAD:ui/typography-unification
