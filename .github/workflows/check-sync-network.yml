name: Check hosted sync network

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install catalogue reader
        run: |
          python -m pip install 'httpx[http2]' cryptography
          python -m pip install --no-deps 'git+https://github.com/HolodoriDB/holodori-asset-tools@13f150fe9dfbd367be53e5ea1c0a4ceb258b74f2'
      - name: Check official catalogues and one chart download
        shell: python
        run: |
          import hashlib
          import json
          import os
          import httpx
          from holodori_asset_tools import catalog

          results = []
          for region in ('us', 'jp', 'as'):
              row = {'runner': '${{ matrix.runner }}', 'region': region}
              try:
                  current = catalog.fetch(url=f'https://{region}.game-hololive-dreams.com/asset/v2/pub/a/5/v/200001/list/{{gen}}')
                  charts = [entry for entry in current.resources if entry.name.endswith('.sus')]
                  entry = next(entry for entry in charts if entry.name == 'chart_m0049_expert.sus')
                  response = httpx.get(entry.url, timeout=60)
                  response.raise_for_status()
                  digest = hashlib.md5(response.content).digest()
                  assert entry.md5 in (digest.hex(), ''.join(format(byte, 'x') for byte in digest))
                  assert len(response.content) == entry.size
                  row.update(ok=True, revision=current.revisionId, charts=len(charts), asset_verified=True)
              except httpx.HTTPStatusError as error:
                  row.update(ok=False, status=error.response.status_code,
                             server=error.response.headers.get('server', ''),
                             response_type=error.response.headers.get('content-type', ''))
              except Exception as error:
                  row.update(ok=False, error=type(error).__name__, detail=str(error))
              print(json.dumps(row), flush=True)
              results.append(row)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('```json\n' + json.dumps(results, indent=2) + '\n```\n')
          with open('catalogue.json', 'w', encoding='utf-8') as report:
              json.dump(results, report)
      - name: Record hosted environment results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalogue-${{ matrix.runner }}
          path: catalogue.json
          archive: true
          if-no-files-found: error
          retention-days: 1

  summary:
    needs: catalogue
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete network probes
        env:
          PROBE_RESULT: ${{ needs.catalogue.result }}
        run: test "$PROBE_RESULT" = success
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: catalogue-*
          path: reports
      - name: Require at least one verified hosted environment
        shell: python
        run: |
          import json, os
          from pathlib import Path
          reports = list(Path('reports').glob('*/catalogue.json'))
          rows = [row for path in reports for row in json.loads(path.read_text())]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('```json\n' + json.dumps(rows, indent=2) + '\n```\n')
          if not rows or not any(row['ok'] and row.get('asset_verified') for row in rows):
              raise SystemExit('No hosted environment could verify an official catalogue and chart')
