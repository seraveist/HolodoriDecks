name: Check hosted sync network

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install catalogue reader
        run: |
          python -m pip install 'httpx[http2]' cryptography
          python -m pip install --no-deps 'git+https://github.com/HolodoriDB/holodori-asset-tools@13f150fe9dfbd367be53e5ea1c0a4ceb258b74f2'
      - name: Check official catalogues and one chart download
        shell: python
        run: |
          import hashlib
          import json
          import os
          import httpx
          from holodori_asset_tools import catalog

          results = []
          for region in ('us', 'jp', 'as'):
              row = {'runner': '${{ matrix.runner }}', 'region': region}
              try:
                  current = catalog.fetch(url=f'https://{region}.game-hololive-dreams.com/asset/v2/pub/a/5/v/200001/list/{{gen}}')
                  charts = [entry for entry in current.resources if entry.name.endswith('.sus')]
                  entry = next(entry for entry in charts if entry.name == 'chart_m0049_expert.sus')
                  response = httpx.get(entry.url, timeout=60)
                  response.raise_for_status()
                  digest = hashlib.md5(response.content).digest()
                  assert entry.md5 in (digest.hex(), ''.join(format(byte, 'x') for byte in digest))
                  assert len(response.content) == entry.size
                  row.update(ok=True, revision=current.revisionId, charts=len(charts), asset_verified=True)
              except httpx.HTTPStatusError as error:
                  row.update(ok=False, status=error.response.status_code,
                             server=error.response.headers.get('server', ''),
                             response_type=error.response.headers.get('content-type', ''))
              except Exception as error:
                  row.update(ok=False, error=type(error).__name__, detail=str(error))
              print(json.dumps(row), flush=True)
              results.append(row)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('```json\n' + json.dumps(results, indent=2) + '\n```\n')
          if not any(row['ok'] for row in results):
              raise SystemExit('No official catalogue was accessible on this hosted runner')
