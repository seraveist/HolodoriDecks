name: Validate v1.1 Stability

on:
  push:
    branches: [release/v1.1.0-stability]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run v1.1 JavaScript regressions
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/test-chart-scoring.mjs
          node scripts/test-targeted-passive-support.mjs
          node scripts/test-exact-global-search.mjs
          node scripts/test-exact-runtime-source.mjs
          node --input-type=module <<'NODE'
          import { runOptimization } from './js/optimizer-core.js';
          import { runOptimizationAsync } from './js/optimizer-client.js';
          if (typeof runOptimization !== 'function' || typeof runOptimizationAsync !== 'function') throw new Error('optimizer worker modules missing');
          console.log('optimizer modules: OK');
          NODE
