name: Apply Theme CSS Refactor

on:
  push:
    branches: [feat/theme-surface-cleanup]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/theme-surface-cleanup

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply semantic theme CSS refactor
        run: node scripts/refactor-theme-css.mjs

      - name: Commit refactor result
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css index.html styles.css .github/workflows/validate.yml .github/workflows/pages.yml
          git commit -m "Refactor theme surfaces to semantic CSS tokens"
          git push origin HEAD:feat/theme-surface-cleanup
