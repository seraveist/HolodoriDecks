name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/configure-pages@v5

      - name: Validate static web
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/build-i18n.mjs
          node --input-type=module <<'NODE'
          await Promise.all([
            import('./js/i18n.js'),
            import('./js/theme.js'),
            import('./js/data.js'),
            import('./js/state.js'),
            import('./js/score.js'),
            import('./js/recommend.js'),
            import('./js/ui/cards.js'),
            import('./js/ui/dom.js'),
            import('./js/ui/member.js'),
            import('./js/ui/modal.js'),
            import('./js/ui/music.js'),
            import('./js/ui/owned.js'),
            import('./js/ui/result.js'),
            import('./js/ui/result-target.js'),
            import('./js/ui/target.js'),
            import('./js/ui/card-detail.js'),
          ]);
          console.log('[pages] module imports resolved');
          NODE
          node --input-type=module <<'NODE'
          import { recommendationValue } from './js/recommend.js';
          const probe = { rankingScore: 100, potentialRankingScore: 140 };
          if (recommendationValue(probe, 'score') !== 100) throw new Error('score target ranking mismatch');
          if (recommendationValue(probe, 'potential') !== 140) throw new Error('potential target ranking mismatch');
          NODE
          grep -q 'data-app-version="20260812.3"' index.html
          grep -q '<option value="potential">최고 잠재 스코어</option>' index.html
          grep -q 'id="theme-toggle"' index.html
          if grep -q 'id="theme-select"' index.html; then exit 1; fi
          grep -q 'data-theme="dark"' css/theme.css
          test -f index.html
          test -f styles.css
          test -f data/generated/cards.json
          test -f data/generated/characters.json
          test -f data/generated/music.json
          test -f data/generated/manifest.json

      - name: Build and validate locale packs
        run: |
          node scripts/build-i18n.mjs
          test -s data/generated/i18n/ko.json
          test -s data/generated/i18n/en.json
          test -s data/generated/i18n/ja.json
          test -s data/generated/i18n/manifest.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('data/generated/i18n/manifest.json', 'utf8'));
          if (!manifest.required_entry_count
            || manifest.card_name_alias_count !== 7
            || Object.keys(manifest.locales ?? {}).length !== 3) {
            throw new Error('invalid i18n manifest');
          }
          console.log(`[pages] ${manifest.required_entry_count} required LangIds validated`);
          NODE

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/data _site/assets
          cp index.html styles.css .nojekyll LOCAL_TEST.md _site/
          cp -R css js _site/
          cp -R data/generated _site/data/
          cp -R assets/cards assets/ui _site/assets/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
