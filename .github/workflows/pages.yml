name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Check reusable recommendation validation
        id: recommendation_validation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/recommendation-validation.py --lookup

      - name: Validate recommendation inventories
        if: steps.recommendation_validation.outputs.reuse != 'true'
        run: node scripts/test-recommendation-inventories.mjs

      - name: Validate static web
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/build-i18n.mjs
          node --check scripts/build-chart-index.mjs
          node --check scripts/build-exact-runtime-index.mjs
          node --check scripts/test-chart-scoring.mjs
          node --check scripts/test-targeted-passive-support.mjs
          node --check scripts/test-passive-stat-rounding.mjs
          node --check scripts/test-passive-target-priority.mjs
          node --check scripts/test-unit-observations.mjs
          node --check scripts/test-support-stacking.mjs
          node --check js/order-reference.js
          node --check scripts/test-generic-order.mjs
          node --check scripts/test-song-representative-order.mjs
          node --check scripts/test-card-preparation.mjs
          node --check scripts/test-simulation-targets.mjs
          node --check scripts/test-collision-choice.mjs
          node --check scripts/test-exact-global-search.mjs
          node --check scripts/test-exact-pruning.mjs
          node --check scripts/test-beam-search.mjs
          node --check scripts/test-exact-runtime-source.mjs
          node --check scripts/test-optimization-session.mjs
          node --check scripts/test-chart-abort.mjs
          node --check scripts/test-browser-smoke.mjs
          python -m py_compile scripts/validate-generated-data.py scripts/rewrite-pages-revisions.py
          node --input-type=module <<'NODE'
          await Promise.all([
            import('./js/i18n.js'),
            import('./js/theme.js'),
            import('./js/data.js'),
            import('./js/chart-data.js'),
            import('./js/chart-score.js'),
            import('./js/order.js'),
            import('./js/state.js'),
            import('./js/score.js'),
            import('./js/card-prepare.js'),
            import('./js/recommend.js'),
            import('./js/optimizer-core.js'),
            import('./js/optimizer-client.js'),
            import('./js/optimization-session.js'),
            import('./js/ui/cards.js'),
            import('./js/ui/dom.js'),
            import('./js/ui/member.js'),
            import('./js/ui/modal.js'),
            import('./js/ui/music.js'),
            import('./js/ui/owned.js'),
            import('./js/ui/result.js'),
            import('./js/ui/target.js'),
            import('./js/ui/card-detail.js'),
          ]);
          console.log('[pages] module imports resolved');
          NODE
          node scripts/test-chart-scoring.mjs
          node scripts/test-song-score-invariants.mjs
          node scripts/test-song-corpus.mjs
          node scripts/test-targeted-passive-support.mjs
          node scripts/test-passive-stat-rounding.mjs
          node scripts/test-passive-target-priority.mjs
          node scripts/test-unit-observations.mjs
          node scripts/test-unit-display.mjs
          node scripts/test-support-stacking.mjs
          node scripts/test-generic-order.mjs
          node scripts/test-song-representative-order.mjs
          node scripts/test-card-preparation.mjs
          node scripts/test-simulation-targets.mjs
          node scripts/test-calculation-modes.mjs
          node scripts/test-collision-choice.mjs
          node scripts/test-exact-global-search.mjs
          node scripts/test-exact-pruning.mjs
          node scripts/test-beam-search.mjs
          node scripts/test-search-order-bounds.mjs
          node scripts/test-optimizer-client.mjs
          node scripts/test-exact-runtime-source.mjs
          node scripts/test-optimization-session.mjs
          node scripts/test-chart-abort.mjs
          node scripts/test-browser-smoke.mjs
          node --input-type=module <<'NODE'
          import { scoreEngineSelfTest } from './js/score.js';
          import { exactShortlistSize, recommendationValue } from './js/recommend.js';
          const probe = { rankingScore: 100, potentialRankingScore: 140 };
          if (recommendationValue(probe, 'score') !== 100) throw new Error('score target ranking mismatch');
          if (recommendationValue(probe, 'potential') !== 140) throw new Error('potential target ranking mismatch');
          if (scoreEngineSelfTest().maxAbsError !== 0) throw new Error('unit-score calibration fixture drift');
          if (exactShortlistSize(700, 50) <= 10) throw new Error('Exact shortlist regression');
          NODE
          node scripts/check-version.mjs
          grep -q '수동 ALL PERFECT' index.html
          grep -q 'name="calculation-mode" value="maximum"' index.html
          if grep -q '<option value="3">★3</option>' index.html; then exit 1; fi
          if grep -q 'TARGET_STATS' js/ui/result.js; then exit 1; fi
          test ! -e js/ui/result-target.js
          grep -q 'id="theme-toggle"' index.html
          if grep -q 'id="theme-select"' index.html; then exit 1; fi
          grep -q 'data-theme="dark"' css/theme.css
          test -f index.html
          test -f styles.css
          test -f data/generated/cards.json
          test -f data/generated/characters.json
          test -f data/generated/music.json
          test -f data/generated/manifest.json
          test -f data/generated/master_refs.json
          test -f data/generated/exact-runtime-index.json

      - name: Validate CSS theme layering
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const neutralFiles = ['css/base.css', 'css/components.css', 'css/owned.css', 'css/modal.css', 'css/tweaks.css'];
          const neutral = await Promise.all(neutralFiles.map(async (path) => [path, await readFile(path, 'utf8')]));
          for (const [path, text] of neutral) {
            if (text.includes('data-theme="dark"')) throw new Error(`dark selector leaked into ${path}`);
            if (text.split('{').length !== text.split('}').length) throw new Error(`brace mismatch in ${path}`);
          }
          const forbiddenSurface = /background(?:-color)?\s*:\s*#(?:fff(?:fff)?|f8faff|f7f9fc|fafbfd|fbfcff|f5f8ff|edf3ff|eef1f6|f9fbfe|e8f7f5|fff0f1|fff5f6)/i;
          for (const [path, text] of neutral) {
            if (forbiddenSurface.test(text)) throw new Error(`theme-sensitive light surface literal remains in ${path}`);
          }
          const light = await readFile('css/tokens.css', 'utf8');
          const dark = await readFile('css/theme.css', 'utf8');
          const requiredTokens = ['ink-900','ink-700','surface-inverse','ink-inverse','brand-line','brand-line-strong','accent-ink','accent-line','warning-ink','danger-soft','danger-line'];
          for (const token of requiredTokens) {
            if (!light.includes(`--${token}:`)) throw new Error(`missing light token --${token}`);
            if (!dark.includes(`--${token}:`)) throw new Error(`missing dark token --${token}`);
          }
          console.log('[theme] semantic surface hierarchy validated');
          NODE
          node scripts/check-version.mjs

      - name: Build and validate derived master data
        run: |
          node scripts/build-i18n.mjs
          node scripts/build-chart-index.mjs
          python scripts/validate-generated-data.py
          test -s data/generated/i18n/ko.json
          test -s data/generated/i18n/en.json
          test -s data/generated/i18n/ja.json
          test -s data/generated/i18n/manifest.json
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('data/generated/i18n/manifest.json', 'utf8'));
          const chart = JSON.parse(await readFile('data/generated/chart-index.json', 'utf8'));
          const runtime = JSON.parse(await readFile('data/generated/exact-runtime-index.json', 'utf8'));
          if (!manifest.required_entry_count
            || !Number.isInteger(manifest.card_name_alias_count)
            || manifest.card_name_alias_count < 0
            || Object.keys(manifest.locales ?? {}).length !== 3) {
            throw new Error('invalid i18n manifest');
          }
          if (runtime.runtimeExactCount !== Object.keys(runtime.charts ?? {}).length
            || runtime.currentMasterSourceCommit !== chart.source_commit
            || runtime.currentMasterChartCount !== chart.chart_count) {
            throw new Error('invalid or stale exact runtime range index');
          }
          console.log(`[pages] ${manifest.required_entry_count} required LangIds; ${runtime.runtimeExactCount}/${chart.chart_count} Runtime Exact charts coherent`);
          NODE

      - name: Install full Python validation tooling
        run: |
          python --version
          python -m pip --version
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 5 --timeout 30 \
              --index-url https://pypi.org/simple \
              -e '.[test,music-search]'; then
              break
            fi
            echo "::warning::Pages Python tooling install failed (attempt ${attempt}/3)."
            if [ "$attempt" -eq 3 ]; then
              python -m pip index versions hunmin --index-url https://pypi.org/simple || true
              exit 1
            fi
            sleep $((attempt * 10))
          done
          python -m pytest -q

      - name: Prepare Pages artifact
        env:
          CARD_ASSET_REVISION: ${{ github.sha }}
        run: |
          mkdir -p _site/data _site/assets
          cp index.html styles.css .nojekyll LOCAL_TEST.md _site/
          cp -R css js _site/
          cp -R data/generated _site/data/
          cp -R assets/cards assets/characters assets/ui _site/assets/
          python scripts/rewrite-pages-revisions.py \
            --root _site \
            --revision "$CARD_ASSET_REVISION"
          node scripts/build-public-assets.mjs --root _site
          python scripts/build-localized-pages.py --root _site
          grep -q '../data/generated/manifest.json' _site/js/data.js
          if grep -q 'manifest.js?v=' _site/js/data.js; then exit 1; fi
          test -s _site/data/generated/music-search.json
          test -s _site/en/index.html
          test -s _site/ja/index.html
          test -s _site/ko/index.html
          test -s _site/sitemap.xml

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Record successful recommendation validation
        if: steps.recommendation_validation.outputs.reuse != 'true' && steps.recommendation_validation.outputs.fingerprint != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recommendation-inventories-v1-${{ steps.recommendation_validation.outputs.fingerprint }}
          path: .local/recommendation-validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          overwrite: true
