name: Validate Static App

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate sync tooling
        run: |
          python -m pip install --disable-pip-version-check -e '.[test]'
          python -m pytest -q
          python -m py_compile scripts/validate-generated-data.py scripts/ingest-chart-metadata.py

      - name: Check JavaScript syntax and module exports
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/build-i18n.mjs
          node --check scripts/build-chart-index.mjs
          node --check scripts/build-exact-runtime-index.mjs
          node --check scripts/test-chart-scoring.mjs
          node --check scripts/test-exact-runtime-source.mjs
          node --check scripts/import-chart-timeline-corpus.mjs
          node --input-type=module <<'NODE'
          await Promise.all([
            import('./js/i18n.js'),
            import('./js/theme.js'),
            import('./js/data.js'),
            import('./js/chart-data.js'),
            import('./js/chart-score.js'),
            import('./js/order.js'),
            import('./js/state.js'),
            import('./js/score.js'),
            import('./js/recommend.js'),
            import('./js/ui/cards.js'),
            import('./js/ui/dom.js'),
            import('./js/ui/member.js'),
            import('./js/ui/modal.js'),
            import('./js/ui/music.js'),
            import('./js/ui/owned.js'),
            import('./js/ui/result.js'),
            import('./js/ui/result-target.js'),
            import('./js/ui/target.js'),
            import('./js/ui/card-detail.js'),
          ]);
          console.log('[validate] module imports resolved');
          NODE
          if grep -R --line-number --fixed-strings 'SLOT_LABELS' js; then
            echo '[validate] obsolete SLOT_LABELS reference found'
            exit 1
          fi

      - name: Validate simulation targets and compact header
        run: |
          node --input-type=module <<'NODE'
          import { recommendationValue } from './js/recommend.js';
          const score = { rankingScore: 100, potentialRankingScore: 140 };
          if (recommendationValue(score, 'score') !== 100) throw new Error('score target ranking mismatch');
          if (recommendationValue(score, 'potential') !== 140) throw new Error('potential target ranking mismatch');
          NODE
          grep -q '<option value="score" selected>최고 유닛 스코어</option>' index.html
          grep -q '<option value="potential">최고 잠재 스코어</option>' index.html
          if grep -q '<option value="performance"' index.html; then exit 1; fi
          if grep -q '<option value="technique"' index.html; then exit 1; fi
          if grep -q '<option value="sense"' index.html; then exit 1; fi
          grep -q 'id="theme-toggle"' index.html
          if grep -q 'id="theme-select"' index.html; then exit 1; fi
          if grep -q '<option value="system">' index.html; then exit 1; fi
          grep -q 'theme-toggle-button' css/tweaks.css
          grep -q 'app-header-actions' css/tweaks.css
          grep -q 'flex-direction: row' css/tweaks.css
          grep -q 'slot-clear-button' js/ui/member.js
          grep -q 'result-card-width: clamp(145px, 42vw, 168px)' css/tweaks.css
          grep -q 'data-theme="dark"' css/theme.css

      - name: Validate CSS theme layering
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const neutralFiles = ['css/base.css', 'css/components.css', 'css/owned.css', 'css/modal.css', 'css/tweaks.css'];
          const neutral = await Promise.all(neutralFiles.map(async (path) => [path, await readFile(path, 'utf8')]));
          for (const [path, text] of neutral) {
            if (text.includes('data-theme="dark"')) throw new Error(`dark selector leaked into ${path}`);
            if (text.split('{').length !== text.split('}').length) throw new Error(`brace mismatch in ${path}`);
          }
          const forbiddenSurface = /background(?:-color)?\s*:\s*#(?:fff(?:fff)?|f8faff|f7f9fc|fafbfd|fbfcff|f5f8ff|edf3ff|eef1f6|f9fbfe|e8f7f5|fff0f1|fff5f6)/i;
          for (const [path, text] of neutral) {
            if (forbiddenSurface.test(text)) throw new Error(`theme-sensitive light surface literal remains in ${path}`);
          }
          const light = await readFile('css/tokens.css', 'utf8');
          const dark = await readFile('css/theme.css', 'utf8');
          const requiredTokens = ['ink-900','ink-700','surface-inverse','ink-inverse','brand-line','brand-line-strong','accent-ink','accent-line','warning-ink','danger-soft','danger-line'];
          for (const token of requiredTokens) {
            if (!light.includes(`--${token}:`)) throw new Error(`missing light token --${token}`);
            if (!dark.includes(`--${token}:`)) throw new Error(`missing dark token --${token}`);
          }
          console.log('[theme] semantic surface hierarchy validated');
          NODE
          grep -q 'styles.css?v=20260812.5' index.html

      - name: Build and validate derived master data
        run: |
          node scripts/build-i18n.mjs
          node scripts/build-chart-index.mjs
          node scripts/test-chart-scoring.mjs
          node scripts/test-exact-runtime-source.mjs
          python scripts/validate-generated-data.py
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const requiredSamples = [
            'la-name-chr-00001',
            'la-card_name-00001-5-uniq-0000-00',
          ];
          for (const locale of ['ko', 'en', 'ja']) {
            const pack = JSON.parse(await readFile(`data/generated/i18n/${locale}.json`, 'utf8'));
            for (const key of requiredSamples) {
              if (typeof pack[key] !== 'string' || !pack[key].trim()) throw new Error(`${locale}: missing ${key}`);
            }
          }
          const manifest = JSON.parse(await readFile('data/generated/i18n/manifest.json', 'utf8'));
          if (!manifest.required_entry_count
            || !Number.isInteger(manifest.card_name_alias_count)
            || manifest.card_name_alias_count < 0
            || Object.keys(manifest.locales ?? {}).length !== 3) {
            throw new Error('invalid i18n manifest');
          }
          const runtime = JSON.parse(await readFile('data/generated/exact-runtime-index.json', 'utf8'));
          if (runtime.runtimeExactCount !== Object.keys(runtime.charts ?? {}).length
            || runtime.runtimeExactCount !== 703
            || runtime.unavailableCount !== 25
            || runtime.rejectedAvailableCount !== 0
            || !/^[0-9a-f]{64}$/.test(runtime.source?.sha256 ?? '')) {
            throw new Error('invalid exact runtime range index');
          }
          console.log(`[validate] ${manifest.required_entry_count} required LangIds; ${runtime.runtimeExactCount} runtime Exact charts validated`);
          NODE

      - name: Check app version and required files
        run: |
          grep -q 'data-app-version="20260812.3"' index.html
          grep -q 'const APP_VERSION = "20260812.3"' js/app.js
          test -f data/generated/cards.json
          test -f data/generated/characters.json
          test -f data/generated/music.json
          test -f data/generated/manifest.json
          test -f data/generated/chart-index.json
          test -f data/generated/live-score-rules.json
          test -f data/generated/exact-runtime-index.json
