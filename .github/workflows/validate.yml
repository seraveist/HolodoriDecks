name: Validate Static App

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all checks without reusing successful proofs
        type: boolean
        default: false
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact generated commit to validate before automatic merge
        required: true
        type: string
      full_validation:
        description: Run all checks without reusing successful proofs
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.plan.outputs.app }}
      public: ${{ steps.plan.outputs.public }}
      contracts: ${{ steps.plan.outputs.contracts }}
      historical: ${{ steps.plan.outputs.historical }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
      - name: Verify requested sync commit
        if: inputs.checkout_ref != ''
        env:
          EXPECTED_HEAD: ${{ inputs.checkout_ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select checks for committed changes
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          FULL_VALIDATION: ${{ inputs.full_validation || false }}
        run: python scripts/ci-changes.py

  metadata:
    needs: changes
    if: needs.changes.outputs.app != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check documentation, versions and CI policy
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 pytest -e .
          python -m pytest -q tests/test_release_metadata.py tests/test_ci_policy.py
          node scripts/check-version.mjs

  workflow_contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install workflow test tooling
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 30 'pytest>=8' 'PyYAML>=6'
      - name: Exercise workflow scripts on system Bash
        run: python -m pytest -q tests/test_sync_workflows.py tests/test_pages_deployment.py

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check reusable recommendation validation
        id: recommendation_validation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/recommendation-validation.py --lookup ${{ inputs.full_validation && '--force' || '' }}
      - name: Install full validation tooling
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 30 --index-url https://pypi.org/simple -e '.[test,music-search]'
      - name: Validate Python tools and data contracts
        run: |
          python -m compileall -q src scripts
          python -m pytest -q
      - name: Validate scoring, search and source browser regressions
        run: node scripts/run-app-validation.mjs
      - name: Validate recommendation inventories
        if: steps.recommendation_validation.outputs.reuse != 'true'
        run: node scripts/test-recommendation-inventories.mjs
      - name: Record successful recommendation validation
        if: steps.recommendation_validation.outputs.reuse != 'true' && steps.recommendation_validation.outputs.fingerprint != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.recommendation_validation.outputs.artifact_name }}
          path: .local/recommendation-validation.json
          archive: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  public:
    needs: changes
    if: needs.changes.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install public build and browser validation tooling
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -e '.[public-build,music-search]'
          if ! fc-match -f '%{family}' 'Noto Sans CJK KR' | grep -q 'Noto Sans CJK'; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Build optimized Pages artifact
        env:
          CARD_ASSET_REVISION: ${{ inputs.checkout_ref || github.sha }}
        run: python scripts/build-pages-artifact.py --revision "$CARD_ASSET_REVISION"
      - name: Validate transport, cache and CSS regressions
        run: |
          mkdir -p .local
          node scripts/test-public-optimization.mjs | tee .local/public-unit.log
      - name: Test optimized public application and actual browser cache
        run: |
          BROWSER_SMOKE_ROOT="$PWD/_site" BROWSER_SMOKE_PORT=4174 \
            BROWSER_SMOKE_ARTIFACT_DIR="$PWD/.local/public-smoke" \
            node scripts/test-browser-smoke-core.mjs | tee .local/public-browser.log
          BROWSER_SMOKE_ROOT="$PWD/_site" BROWSER_SMOKE_PORT=4175 \
            BOARD_SMOKE_ARTIFACT_DIR="$PWD/.local/public-board-smoke" node scripts/test-board-browser.mjs
      - name: Upload validation reports and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-optimization-validation
          path: |
            .local/public-board-smoke/
            .local/public-smoke/
            .local/public-unit.log
            .local/public-browser.log
          if-no-files-found: ignore
          retention-days: 7

  historical:
    needs: changes
    if: needs.changes.outputs.historical == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Reproduce portable scoring handoff
        run: node scripts/run-scoring-validation.mjs --historical-only

  validate:
    needs: [changes, metadata, workflow_contracts, app, public, historical]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require all selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ needs.changes.outputs.plan }}
        run: python scripts/check-ci-results.py
