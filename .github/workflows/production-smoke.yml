name: Smoke Production

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate production smoke script
        run: node --check scripts/test-production-smoke.mjs

      - name: Verify holosims.net deployment
        env:
          PRODUCTION_URL: https://holosims.net/
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/test-production-smoke.mjs

      - name: Summary
        run: |
          {
            echo "## Holodori production smoke"
            echo "- URL: https://holosims.net/"
            echo "- deployment: ${{ github.event.workflow_run.head_sha }}"
            echo "- status: success"
          } >> "$GITHUB_STEP_SUMMARY"
