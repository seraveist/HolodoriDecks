name: Build and verify board foundation candidate
on:
  push:
    branches: [feature/member-board-ui]
    paths: [.github/workflows/board-foundation-apply.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  foundation:
    if: github.repository == 'seraveist/HolodoriDecks' && github.ref == 'refs/heads/feature/member-board-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Reconstruct reviewed source with per-file hashes
        run: |
          mkdir -p /tmp/board-foundation-result
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          source = ''.join(path.read_text().strip() for path in sorted(pathlib.Path('.board-transfer').glob('part*.txt')))
          payload = lzma.decompress(base64.b64decode(source, validate=True))
          assert hashlib.sha256(payload).hexdigest() == '02c221a461fb029d56239665bba9c003896283aa139e834fb932ef689441678e'
          entries = json.loads(payload)
          allowed = set('BOARD_UI.md DATA_SYNC.md css/boards.css js/board-copy.js js/board-data.js js/board-entry.js js/board-state.js js/ui/boards.js scripts/build-board-i18n.mjs scripts/build-i18n.mjs scripts/build-public-assets.mjs scripts/check-automation-gate.py scripts/test-board-browser.mjs scripts/test-board-data.mjs scripts/test-board-state.mjs scripts/validate-generated-data.py src/holodori_decksim/automation_gate.py src/holodori_decksim/board_data.py src/holodori_decksim/sources.py src/holodori_decksim/sync.py tests/test_board_data.py .github/workflows/static-performance.yml .github/workflows/sync-master-data.yml .github/workflows/validate.yml'.split())
          assert {entry['path'] for entry in entries} == allowed and len(entries) == len(allowed)
          for entry in entries:
              path = pathlib.Path(entry['path'])
              assert not path.is_symlink()
              if entry['base'] is None:
                  assert not path.exists()
                  lines = []
              else:
                  data = path.read_bytes()
                  assert hashlib.sha256(data).hexdigest() == entry['base'], str(path) + ': base changed'
                  lines = data.decode('utf8').splitlines(keepends=True)
              for start, end, replacement in reversed(entry['ops']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              data = ''.join(lines).encode('utf8')
              assert hashlib.sha256(data).hexdigest() == entry['sha256'], str(path) + ': target mismatch'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          pathlib.Path('/tmp/board-foundation-result/source-files.json').write_text(json.dumps([{k:e[k] for k in ('path','sha256')} for e in entries], indent=2))
          print('Reconstructed', len(entries), 'source files; scoring engine paths excluded.')
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -e '.[test,music-search]'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate pinned Master boards and translations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          holodori-sync --pinned --force | tee /tmp/board-foundation-result/sync.json
          node scripts/build-board-i18n.mjs | tee /tmp/board-foundation-result/board-i18n.log
          python scripts/validate-generated-data.py | tee /tmp/board-foundation-result/data-validation.json
          python -m pytest -q | tee /tmp/board-foundation-result/pytest.log
          node scripts/test-board-state.mjs | tee /tmp/board-foundation-result/board-state.log
          node scripts/test-board-data.mjs | tee /tmp/board-foundation-result/board-data.log
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Prepare candidate Git objects without updating any branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feature/member-board-ui
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .board-transfer .github/workflows/board-foundation-apply.yml .github/workflows/board-foundation-snapshot.yml
          git add BOARD_UI.md DATA_SYNC.md css/boards.css js/board* js/ui/boards.js scripts/build-board-i18n.mjs scripts/build-i18n.mjs scripts/build-public-assets.mjs scripts/check-automation-gate.py scripts/test-board*.mjs scripts/validate-generated-data.py src/holodori_decksim/automation_gate.py src/holodori_decksim/board_data.py src/holodori_decksim/sources.py src/holodori_decksim/sync.py tests/test_board_data.py data/generated data/upstream.json data/sync_state.json .github/workflows/static-performance.yml .github/workflows/sync-master-data.yml .github/workflows/validate.yml
          git diff --cached --exit-code -- js/score.js js/unit-score.js js/chart-score.js js/recommend.js js/optimizer-core.js js/order.js js/card-prepare.js
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/seraveist/HolodoriDecks'
          parent = os.environ['GITHUB_SHA']
          def api(endpoint, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(root + endpoint, data=body, headers={'Authorization':'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'User-Agent':'board-foundation-staging'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert api('/git/ref/heads/feature/member-board-ui')['object']['sha'] == parent
          base_tree = api('/git/commits/' + parent)['tree']['sha']
          entries = []
          for row in subprocess.check_output(['git','diff','--cached','--name-status','--no-renames'], text=True).splitlines():
              status, name = row.split('\t')
              entry = {'path':name, 'mode':'100644', 'type':'blob'}
              if status == 'D':
                  entry['sha'] = None
              else:
                  assert status in ('A','M')
                  content = pathlib.Path(name).read_bytes()
                  result = api('/git/blobs', {'content':base64.b64encode(content).decode(), 'encoding':'base64'})
                  expected = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  assert result['sha'] == expected, name
                  entry['sha'] = result['sha']
              entries.append(entry)
          tree = api('/git/trees', {'base_tree':base_tree, 'tree':entries})['sha']
          assert tree == subprocess.check_output(['git','write-tree'], text=True).strip()
          result = api('/git/commits', {'message':'feat: synchronize Master-backed board foundation without scoring changes', 'tree':tree, 'parents':[parent]})
          pathlib.Path('/tmp/board-foundation-result/head.txt').write_text(result['sha'] + '\n')
          pathlib.Path('/tmp/board-foundation-result/candidate.json').write_text(json.dumps({'parent':parent,'commit':result['sha'],'tree':tree,'files':entries}, indent=2))
          print('Staged candidate:', result['sha'], 'tree:', tree, 'files:', len(entries))
          print('No branch, pull request, main, or deployment was modified by this step.')
          PY
          git commit -m 'Local archive of staged board foundation candidate'
          git archive --format=tar HEAD -o /tmp/board-foundation-result/source.tar
      - name: Real source browser and transport validation
        run: |
          node scripts/test-public-optimization.mjs | tee /tmp/board-foundation-result/public-optimization.log
          node scripts/test-board-browser.mjs | tee /tmp/board-foundation-result/board-browser.log
      - name: Optimized Pages browser validation
        env:
          CARD_ASSET_REVISION: ${{ github.sha }}
        run: |
          mkdir -p _site/data _site/assets
          cp index.html styles.css .nojekyll LOCAL_TEST.md _site/
          cp -R css js _site/
          cp -R data/generated _site/data/
          cp -R assets/cards assets/ui _site/assets/
          python scripts/rewrite-pages-revisions.py --root _site --revision "$CARD_ASSET_REVISION"
          node scripts/build-public-assets.mjs --root _site > /tmp/board-foundation-result/public-assets.json
          BROWSER_SMOKE_ROOT="$PWD/_site" BROWSER_SMOKE_PORT=4175 BOARD_SMOKE_ARTIFACT_DIR="$PWD/.local/public-board-smoke" node scripts/test-board-browser.mjs | tee /tmp/board-foundation-result/public-board-browser.log
      - name: Preserve candidate and diagnostics
        if: always()
        run: |
          mkdir -p /tmp/board-foundation-result
          if [ ! -f /tmp/board-foundation-result/source.tar ]; then tar --exclude=.git --exclude=_site --exclude=.local -cf /tmp/board-foundation-result/source.tar .; fi
          if [ -d .local/board-smoke ]; then cp -R .local/board-smoke /tmp/board-foundation-result/; fi
          if [ -d .local/public-board-smoke ]; then cp -R .local/public-board-smoke /tmp/board-foundation-result/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: board-foundation-result
          path: /tmp/board-foundation-result/
          retention-days: 2
          if-no-files-found: error
