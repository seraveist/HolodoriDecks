name: Sync master data

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force normalization even when watched upstream files are unchanged"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
  schedule:
    # 00:00 KST = 15:00 UTC on the previous calendar day.
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: sync-holodori-master-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and tests
        run: python -m pip install -e . pytest
      - name: Run unit tests
        run: pytest
      - name: Validate static UI script
        run: node --check app.js
      - name: Inspect and sync upstream master data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.force }}" = "true" ]; then
            holodori-sync --force
          else
            holodori-sync
          fi
      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/generated")
          cards = json.loads((root / "cards.json").read_text(encoding="utf-8"))
          music = json.loads((root / "music.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))

          assert cards, "cards.json is empty"
          assert music, "music.json is empty"
          assert manifest["card_count"] == len(cards)
          assert manifest["music_count"] == len(music)
          assert manifest["leader_card_count"] > 0
          assert manifest["raden_card_count"] >= 3
          assert manifest["raden_leader_card_count"] >= 3
          assert len(manifest["source_commit"]) == 40

          raden = [card for card in cards if card["character_id"] == "chr-06004"]
          assert any(card["rarity"] == 5 and card["leader"] for card in raden)
          assert all(card["skills"]["active"]["levels"] for card in cards if card["skills"]["active"]["id"])
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Commit normalized data when changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated data/upstream.json data/sync_state.json
          if git diff --cached --quiet; then
            echo "No watched master-data changes."
            exit 0
          fi
          git commit -m "Sync Holodori master data"
          git push
