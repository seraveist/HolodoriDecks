name: Sync Holodori master data

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the resolved upstream snapshot is unchanged
        required: false
        default: false
        type: boolean
      dry_run:
        description: Validate changes without pushing a sync branch or PR
        required: false
        default: false
        type: boolean
      auto_merge:
        description: Automatically merge a validated, non-anomalous sync PR
        required: false
        default: true
        type: boolean
  schedule:
    # 00:15 KST every day.
    - cron: "15 15 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: holodori-master-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Diagnose Python installer
        run: |
          python --version
          python -m pip --version

      - name: Install core sync tooling
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -e '.[test]'; then
              exit 0
            fi
            echo "::warning::Core sync tooling install failed (attempt ${attempt}/3)."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Preserve automation baseline
        run: |
          cp data/generated/manifest.json /tmp/manifest-before.json
          cp data/generated/cards.json /tmp/cards-before.json
          cp data/generated/characters.json /tmp/characters-before.json
          cp data/generated/music.json /tmp/music-before.json
          cp data/generated/chart-index.json /tmp/chart-index-before.json
          cp data/generated/exact-runtime-index.json /tmp/exact-runtime-index-before.json

      - name: Resolve and normalize upstream snapshot
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ inputs.force || false }}" = "true" ]; then
            args+=(--force)
          fi
          holodori-sync "${args[@]}" | tee /tmp/sync-result.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          result = json.load(open('/tmp/sync-result.json', encoding='utf-8'))
          print(f"changed={str(bool(result.get('changed'))).lower()}")
          print(f"master_version={result.get('master_version', '')}")
          print(f"upstream_commit={result.get('upstream_commit', '')}")
          PY

      - name: Rebuild locale, chart, and Runtime Exact derived data
        if: steps.sync.outputs.changed == 'true'
        run: |
          node scripts/build-i18n.mjs
          node scripts/build-chart-index.mjs
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            -o /tmp/holodori-chart-timelines.json \
            https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json
          node scripts/build-exact-runtime-index.mjs --input /tmp/holodori-chart-timelines.json

      - name: Validate synchronized data
        if: steps.sync.outputs.changed == 'true'
        run: |
          python scripts/validate-generated-data.py --baseline /tmp/manifest-before.json
          python -m pytest -q
          python -m py_compile scripts/check-automation-gate.py
          node scripts/test-chart-scoring.mjs
          node scripts/test-targeted-passive-support.mjs
          node scripts/test-card-preparation.mjs
          node scripts/test-simulation-targets.mjs
          node scripts/test-collision-choice.mjs
          node scripts/test-exact-global-search.mjs
          node scripts/test-exact-pruning.mjs
          node scripts/test-beam-search.mjs
          node scripts/test-exact-runtime-source.mjs
          node scripts/test-optimization-session.mjs
          node scripts/test-chart-abort.mjs
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/build-i18n.mjs
          node --check scripts/build-chart-index.mjs
          node --check scripts/build-exact-runtime-index.mjs

      - name: Evaluate Master auto-merge safety
        id: gate
        if: steps.sync.outputs.changed == 'true'
        run: |
          python scripts/check-automation-gate.py master \
            --previous-cards /tmp/cards-before.json \
            --current-cards data/generated/cards.json \
            --previous-characters /tmp/characters-before.json \
            --current-characters data/generated/characters.json \
            --previous-music /tmp/music-before.json \
            --current-music data/generated/music.json \
            --previous-chart-index /tmp/chart-index-before.json \
            --current-chart-index data/generated/chart-index.json \
            --previous-runtime-index /tmp/exact-runtime-index-before.json \
            --current-runtime-index data/generated/exact-runtime-index.json \
            --output /tmp/master-automerge-gate.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          gate = json.load(open('/tmp/master-automerge-gate.json', encoding='utf-8'))
          print(f"safe={str(bool(gate['safe'])).lower()}")
          print(f"reason_count={len(gate['reasons'])}")
          PY

      - name: Detect generated diff
        id: diff
        if: steps.sync.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain -- data/generated data/upstream.json data/sync_state.json)" ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show dry-run summary
        if: steps.diff.outputs.has_diff == 'true' && inputs.dry_run == true
        run: |
          git status --short -- data/generated data/upstream.json data/sync_state.json
          git diff --stat -- data/generated data/upstream.json data/sync_state.json
          cat /tmp/master-automerge-gate.json

      - name: Commit sync branch
        id: sync_commit
        if: steps.diff.outputs.has_diff == 'true' && inputs.dry_run != true
        env:
          SYNC_BRANCH: automation/master-data-sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add data/generated data/upstream.json data/sync_state.json
          git commit -m "Sync Holodori master data to ${{ steps.sync.outputs.master_version }}"
          git push --force origin "$SYNC_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or refresh sync pull request
        id: sync_pr
        if: steps.diff.outputs.has_diff == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/master-data-sync
          MASTER_VERSION: ${{ steps.sync.outputs.master_version }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('data/sync_state.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/generated/manifest.json').read_text(encoding='utf-8'))
          chart = json.loads(Path('data/generated/chart-index.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('data/generated/exact-runtime-index.json').read_text(encoding='utf-8'))
          gate = json.loads(Path('/tmp/master-automerge-gate.json').read_text(encoding='utf-8'))
          locale_text = '\n'.join(
              f"- {name}: `{config['commit']}` ({config['repository']})"
              for name, config in manifest['locales'].items()
          )
          changed = ', '.join(state.get('changed_refs', [])) or 'generated normalization'
          counts = state.get('counts', {})
          if gate['safe']:
              gate_text = '- Status: **eligible for automatic merge**\n- No anomaly gate was triggered.'
          else:
              reasons = '\n'.join(f"- {reason}" for reason in gate['reasons'])
              gate_text = f'- Status: **manual review required**\n{reasons}'
          body = f"""## Automated Holodori master-data sync

          This PR was generated from version-aligned upstream snapshots. Safe additive updates are automatically merged; anomalous updates remain open for administrator review.

          - Master version: `{manifest['master_version']}`
          - Core snapshot: `{manifest['source_repository']}@{manifest['source_commit']}`
          - Change triggers: {changed}
          - Cards: {counts.get('cards', manifest['card_count'])}
          - Characters: {counts.get('characters', manifest['character_count'])}
          - Music: {counts.get('music', manifest['music_count'])}
          - Difficulty charts: {chart.get('chart_count', 0)}
          - Runtime Exact compatible charts: {runtime.get('runtimeExactCount', 0)}
          - Runtime Exact rejected available charts: {runtime.get('rejectedAvailableCount', 0)}
          - Runtime Exact source-unavailable charts: {runtime.get('unavailableCount', 0)}
          - Stale Local Exact chart metadata: {chart.get('stale_metadata_count', 0)}

          ### Automatic merge gate
          {gate_text}

          ### Locale snapshots
          {locale_text}

          ### Validation performed before this PR
          - KO/EN/JA version alignment and generated-data structural validation
          - no catastrophic data drop
          - CardPotential / structured skill preparation regression
          - score / potential / collision / Exact / Beam / cancellation regressions
          - Runtime Exact current-Master coherence
          - Python sync tests and JavaScript syntax checks
          """
          Path('/tmp/sync-pr-body.md').write_text(
              '\n'.join(line.strip() for line in body.splitlines()) + '\n',
              encoding='utf-8',
          )
          PY

          short="${MASTER_VERSION:0:12}"
          title="Sync Holodori master data (${short})"
          number="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file /tmp/sync-pr-body.md
            state=updated
          else
            set +e
            output="$(gh pr create --base main --head "$SYNC_BRANCH" --title "$title" --body-file /tmp/sync-pr-body.md 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              printf '%s\n' "$output" >&2
              exit "$status"
            fi
            echo "$output"
            state=created
            number="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          test -n "$number"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Auto-merge safe Master sync
        id: auto_merge
        if: >-
          steps.diff.outputs.has_diff == 'true' &&
          inputs.dry_run != true &&
          steps.gate.outputs.safe == 'true' &&
          steps.sync_pr.outputs.number != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.auto_merge == true)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.sync_pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.sync_commit.outputs.head_sha }}
        run: |
          actual_head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          test "$actual_head" = "$EXPECTED_HEAD"
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$EXPECTED_HEAD"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Dispatching card-asset validation before production deployment."
          gh workflow run sync-card-assets.yml --ref main -f deploy_on_success=true

      - name: Flag anomaly for administrator review
        if: steps.diff.outputs.has_diff == 'true' && steps.gate.outputs.safe == 'false'
        run: |
          echo "::warning::Master sync passed structural validation but tripped the automatic-merge anomaly gate. PR #${{ steps.sync_pr.outputs.number }} remains open for administrator review."
          cat /tmp/master-automerge-gate.json

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Holodori master sync"
            echo "- upstream change detected: ${{ steps.sync.outputs.changed || 'unknown' }}"
            echo "- generated diff: ${{ steps.diff.outputs.has_diff || 'false' }}"
            echo "- master version: ${{ steps.sync.outputs.master_version || 'n/a' }}"
            echo "- auto-merge safe: ${{ steps.gate.outputs.safe || 'n/a' }}"
            echo "- auto-merged: ${{ steps.auto_merge.outputs.merged || 'false' }}"
            echo "- sync PR: ${{ steps.sync_pr.outputs.number || 'not-needed' }}"
            echo "- dry run: ${{ inputs.dry_run || false }}"
          } >> "$GITHUB_STEP_SUMMARY"
