name: Sync master data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Sync upstream master data
        run: holodori-sync --force
      - name: Run tests
        run: python -m pip install pytest && pytest
      - name: Commit normalized data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated data/sync_state.json
          if git diff --cached --quiet; then
            echo "No master-data changes."
            exit 0
          fi
          git commit -m "Sync Holodori master data"
          git push
