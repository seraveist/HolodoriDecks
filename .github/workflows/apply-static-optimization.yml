name: Apply verified static optimization source
on:
  push:
    branches: [perf/static-data-rendering]
    paths:
      - .ci/static-optimization.patch.gz.*
      - .github/workflows/apply-static-optimization.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/perf/static-data-rendering'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: python -m pip install pytest tinycss2==1.4.0
      - name: Apply SHA-256 verified source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib
          chunks = [Path(f'.ci/static-optimization.patch.gz.{i}').read_bytes() for i in (1,2,3)]
          # Repair the single transport-byte transcription before checking the full patch digest.
          second = bytearray(chunks[1])
          assert second[3740] == 20
          second[3740] = 4
          chunks[1] = bytes(second)
          patch = gzip.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest() == '2c163689223eff847912fbd54bc50935e2db601604c742a752d9e4c852dd3540'
          Path('/tmp/static-optimization.patch').write_bytes(patch)
          PY
          git apply --check /tmp/static-optimization.patch
          git apply /tmp/static-optimization.patch
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/test-public-optimization.mjs
          python -m pytest -q tests/test_public_assets.py tests/test_public_site.py tests/test_pages_revision_rewrite.py
      - name: Commit ordinary source files on the feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/perf/static-data-rendering | cut -f1)" = "$EXPECTED_HEAD"
          rm .ci/static-optimization.patch.gz.*
          git add js scripts tests pyproject.toml STATIC_PERFORMANCE.md .ci
          if git diff --cached --name-only | grep '^.github/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: optimize public data transport and owned-card rendering'
          git push origin HEAD:refs/heads/perf/static-data-rendering
