name: Bootstrap generated data

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-holodori-generated-data
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Generate initial normalized snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: holodori-sync --force
      - name: Commit normalized snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated data/upstream.json data/sync_state.json
          if git diff --cached --quiet; then
            echo "No generated data to add."
            exit 0
          fi
          git commit -m "Bootstrap normalized master data"
          git push
