name: Temporary exact chart corpus audit

on:
  push:
    branches: [data/exact-chart-corpus-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download pinned public timeline snapshot
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json \
            --output /tmp/holodori-chart-timelines.json
          ls -lh /tmp/holodori-chart-timelines.json
          sha256sum /tmp/holodori-chart-timelines.json

      - name: Audit and convert compatible charts in ephemeral workspace
        run: |
          node --check scripts/import-chart-timeline-corpus.mjs
          node scripts/import-chart-timeline-corpus.mjs \
            --input /tmp/holodori-chart-timelines.json \
            --report /tmp/exact-corpus-report.json \
            --write
          echo "converted files: $(find data/generated/charts -maxdepth 1 -name '*.json' | wc -l)"
          du -sh data/generated/charts
          du -sb data/generated/charts

      - name: Rebuild index and validate 703-chart conversion
        run: |
          node scripts/build-chart-index.mjs
          python scripts/validate-generated-data.py
          node scripts/test-chart-scoring.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const index = JSON.parse(await fs.readFile('data/generated/chart-index.json', 'utf8'));
          if (index.exact_metadata_count !== 703) {
            throw new Error(`expected 703 exact charts, got ${index.exact_metadata_count}`);
          }
          if (index.stale_metadata_count !== 0) {
            throw new Error(`expected 0 stale imported charts, got ${index.stale_metadata_count}`);
          }
          console.log(`validated ${index.exact_metadata_count}/${index.chart_count} exact chart metadata files`);
          NODE

      - name: Benchmark heaviest exact chart order searches
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { performance } from 'node:perf_hooks';
          import { evaluateDeck } from './js/score.js';
          import { optimizeRecommendationOrders } from './js/order.js';

          const index = JSON.parse(await fs.readFile('data/generated/chart-index.json', 'utf8'));
          const musicRows = JSON.parse(await fs.readFile('data/generated/music.json', 'utf8'));
          const scoreRules = JSON.parse(await fs.readFile('data/generated/live-score-rules.json', 'utf8'));
          const musicById = new Map(musicRows.map((row) => [row.id, row]));
          const exact = Object.values(index.charts)
            .filter((chart) => chart.metadataPath)
            .sort((a, b) => b.fullComboNoteCount - a.fullComboNoteCount)
            .slice(0, 5);

          function member(id, offset) {
            return {
              id,
              characterId: `char-${id}`,
              characterName: id,
              attribute: (offset % 3) + 1,
              groupings: new Set(),
              profile: { level: 80, currentLevel: 80, maxLevel: 80, potential: 0, levelMode: 'current' },
              stats: { p: 8000 + offset * 500, t: 7600 + offset * 400, s: 7200 + offset * 300 },
              enhancementPermyriad: 0,
              passive: null,
              active: {
                level: 1,
                interval: 12 + offset * 3,
                probability: 0.55 + offset * 0.05,
                duration: 8 + offset,
                baseScoreUp: 20 + offset * 3,
                conditionalScoreUp: 20 + offset * 3,
                condition: null,
                description: `${id} active`,
              },
              special: {
                level: 1,
                duration: 10 + offset,
                support: 15 + offset * 5,
                activationRateUp: 5 + offset * 2,
                condition: null,
                description: `${id} special`,
              },
            };
          }

          const leader = {
            id: 'L',
            characterId: 'char-L',
            characterName: 'Leader',
            leader: {
              primaryCondition: [],
              primaryEffects: { p: 0, t: 0, s: 0, support: 10 },
              additionalCondition: [],
              additionalEffects: { p: 0, t: 0, s: 0, support: 0 },
              description: 'benchmark leader',
            },
          };
          const members = [1, 2, 3, 4, 5].map((offset) => member(`M${offset}`, offset));
          const preparedCards = new Map([leader, ...members].map((card) => [card.id, card]));

          const rows = [];
          for (const chart of exact) {
            const relative = String(chart.metadataPath).replace(/^\.\//, '');
            const metadata = JSON.parse(await fs.readFile(`data/generated/${relative}`, 'utf8'));
            const sourceSong = musicById.get(chart.musicId);
            const song = { ...sourceSong, _chart: { ...chart, metadata }, _scoreRules: scoreRules };
            const baseline = evaluateDeck({
              leader,
              members,
              music: song,
              difficulty: chart.difficulty,
              playMode: 'manual',
              separateRole: true,
            });
            const recommendation = {
              ok: true,
              results: Array.from({ length: 10 }, () => ({
                members: [leader.id, ...members.map((m) => m.id)],
                score: baseline,
                rankingValue: baseline.rankingScore,
              })),
              members: [leader.id, ...members.map((m) => m.id)],
              score: baseline,
            };
            const started = performance.now();
            const optimized = optimizeRecommendationOrders({
              recommendation,
              preparedCards,
              currentMembers: [null, null, null, null, null, null],
              lockedSlots: [false, false, false, false, false, false],
              music: song,
              difficulty: chart.difficulty,
              playMode: 'manual',
              simulationTarget: 'score',
              separateRole: true,
              resultCount: 5,
            });
            const elapsedMs = performance.now() - started;
            rows.push({
              key: `${chart.musicId}:${chart.difficulty}`,
              notes: chart.fullComboNoteCount,
              evaluated: optimized.orderOptimization?.evaluatedCount,
              elapsedMs: Math.round(elapsedMs * 10) / 10,
            });
          }
          console.log(JSON.stringify(rows, null, 2));
          NODE

      - name: Show compact audit summary
        if: always()
        run: |
          if [ -f /tmp/exact-corpus-report.json ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('/tmp/exact-corpus-report.json', 'utf8'));
          console.log(JSON.stringify({
            corpus: r.corpus,
            currentMaster: r.currentMaster,
            compatibility: r.compatibility,
            write: r.write,
          }, null, 2));
          NODE
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-corpus-audit-report
          path: /tmp/exact-corpus-report.json
          if-no-files-found: ignore
