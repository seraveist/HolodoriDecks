name: Temporary exact chart corpus audit

on:
  push:
    branches: [data/exact-chart-corpus-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download pinned public timeline snapshot
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/asciisyaez/yagoo-dori/6c2c95d52c268862d34fb523d965f09a3108bbbd/data/generated/holodori-chart-timelines.json \
            --output /tmp/holodori-chart-timelines.json
          ls -lh /tmp/holodori-chart-timelines.json
          sha256sum /tmp/holodori-chart-timelines.json

      - name: Audit and convert compatible charts in ephemeral workspace
        run: |
          node --check scripts/import-chart-timeline-corpus.mjs
          set +e
          node scripts/import-chart-timeline-corpus.mjs \
            --input /tmp/holodori-chart-timelines.json \
            --report /tmp/exact-corpus-report.json \
            --write
          audit_status=$?
          set -e
          if [ "$audit_status" -ne 0 ] && [ "$audit_status" -ne 2 ]; then
            exit "$audit_status"
          fi
          echo "strict_fixture_parity_exit=$audit_status"
          echo "converted files: $(find data/generated/charts -maxdepth 1 -name '*.json' | wc -l)"
          du -sh data/generated/charts
          du -sb data/generated/charts

      - name: Compare existing and corpus fixture through DeckSim score kernel
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { songKernel } from './js/chart-score.js';

          const existing = JSON.parse(await fs.readFile('data/generated/charts/m0049-EXPERT.json', 'utf8'));
          // The write step replaced m0049 with the corpus version, so recover the release fixture from main.
          const response = await fetch('https://raw.githubusercontent.com/seraveist/HolodoriDecks/e06075b83709d48fc672c82906a3780a2f3f4e35/data/generated/charts/m0049-EXPERT.json');
          if (!response.ok) throw new Error(`fixture HTTP ${response.status}`);
          const releaseFixture = await response.json();
          const rules = JSON.parse(await fs.readFile('data/generated/live-score-rules.json', 'utf8'));
          const context = (notes) => ({ notes: notes.length, coefficient: 5, noteTimeline: notes });
          const result = {};
          for (const mode of ['manual', 'auto']) {
            const releaseKernel = songKernel(context(releaseFixture.notes), mode, rules);
            const corpusKernel = songKernel(context(existing.notes), mode, rules);
            result[mode] = {
              releaseKernel,
              corpusKernel,
              delta: corpusKernel - releaseKernel,
              relativePct: releaseKernel ? (corpusKernel / releaseKernel - 1) * 100 : 0,
            };
          }
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Rebuild index and validate 703-chart conversion
        run: |
          node scripts/build-chart-index.mjs
          python scripts/validate-generated-data.py
          node scripts/test-chart-scoring.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const index = JSON.parse(await fs.readFile('data/generated/chart-index.json', 'utf8'));
          if (index.exact_metadata_count !== 703) {
            throw new Error(`expected 703 exact charts, got ${index.exact_metadata_count}`);
          }
          if (index.stale_metadata_count !== 0) {
            throw new Error(`expected 0 stale imported charts, got ${index.stale_metadata_count}`);
          }
          console.log(`validated ${index.exact_metadata_count}/${index.chart_count} exact chart metadata files`);
          NODE

      - name: Show compact audit summary
        if: always()
        run: |
          if [ -f /tmp/exact-corpus-report.json ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('/tmp/exact-corpus-report.json', 'utf8'));
          console.log(JSON.stringify({
            corpus: r.corpus,
            currentMaster: r.currentMaster,
            compatibility: r.compatibility,
          }, null, 2));
          NODE
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-corpus-audit-report
          path: /tmp/exact-corpus-report.json
          if-no-files-found: ignore
