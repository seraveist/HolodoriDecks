name: Validate public static optimization
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install public build and browser validation tooling
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 30 -e '.[test,music-search]'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Validate transport, cache and CSS regressions
        run: |
          mkdir -p .local
          node scripts/test-public-optimization.mjs | tee .local/public-unit.log
          python -m pytest -q tests/test_public_assets.py tests/test_public_site.py tests/test_pages_revision_rewrite.py
      - name: Test unbundled source application
        env:
          BROWSER_SMOKE_ARTIFACT_DIR: .local/source-smoke
        run: node scripts/test-browser-smoke.mjs | tee .local/source-browser.log
      - name: Build optimized Pages artifact
        env:
          CARD_ASSET_REVISION: ${{ github.sha }}
        run: |
          mkdir -p _site/data _site/assets
          cp index.html styles.css .nojekyll LOCAL_TEST.md _site/
          cp -R css js _site/
          cp -R data/generated _site/data/
          cp -R assets/cards assets/ui _site/assets/
          python scripts/rewrite-pages-revisions.py --root _site --revision "$CARD_ASSET_REVISION"
          node scripts/build-public-assets.mjs --root _site | tee .local/public-assets.json
          python scripts/build-localized-pages.py --root _site
      - name: Test optimized public application and actual browser cache
        run: |
          BROWSER_SMOKE_ROOT="$PWD/_site" BROWSER_SMOKE_PORT=4174 \
            BROWSER_SMOKE_ARTIFACT_DIR="$PWD/.local/public-smoke" \
            node scripts/test-browser-smoke-core.mjs | tee .local/public-browser.log
      - name: Upload validation reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-optimization-validation
          path: |
            .local/source-smoke/
            .local/public-smoke/
            .local/public-unit.log
            .local/source-browser.log
            .local/public-assets.json
            .local/public-browser.log
          if-no-files-found: ignore
          retention-days: 7
