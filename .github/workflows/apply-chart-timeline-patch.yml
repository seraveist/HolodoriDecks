name: Apply Chart Timeline Patch

on:
  push:
    branches: [feat/chart-timeline-scoring]
    paths:
      - .github/workflows/apply-chart-timeline-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chart-timeline-scoring
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Patch integration files
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker not in text:
                  p.write_text(text.rstrip() + "\n\n" + block.strip() + "\n", encoding="utf-8")

          # score.js: chart-aware context and exact time-resolved projection.
          replace_once(
              "js/score.js",
              'export const SCORE_ENGINE_VERSION = "unit-score-v0.4-potential + song-score-v0.3-static";',
              'import { buildSongContext, songKernel, timelineSongProjection } from "./chart-score.js?v=20260812.4";\n\nexport const SCORE_ENGINE_VERSION = "unit-score-v0.5-potential + song-score-v0.4-chart-timeline";',
          )
          old_context = '''function contextFromMusic(music, difficulty) {
            const density = DIFFICULTY_NOTE_DENSITY[difficulty] ?? DIFFICULTY_NOTE_DENSITY.EXPERT;
            const duration = Math.max(1, finite(music?.playing_seconds, UNIT_CONTEXT.duration));
            const coefficient = Math.max(1, finite(music?.live_score_coefficient_permil, UNIT_CONTEXT.coefficient));
            return {
              kind: music ? "song" : "generic",
              duration,
              notes: Math.max(1, Math.round(duration * density)),
              coefficient,
              comboMultiplier: averageComboMultiplier(Math.max(1, Math.round(duration * density))),
              density,
              title: music?.title ?? "범용 악곡",
            };
          }'''
          new_context = '''function contextFromMusic(music, difficulty) {
            if (music) {
              const context = buildSongContext(music, difficulty, music?._chart ?? null);
              return {
                ...context,
                comboMultiplier: averageComboMultiplier(context.notes),
              };
            }
            const density = DIFFICULTY_NOTE_DENSITY[difficulty] ?? DIFFICULTY_NOTE_DENSITY.EXPERT;
            return {
              ...UNIT_CONTEXT,
              kind: "generic",
              comboMultiplier: averageComboMultiplier(UNIT_CONTEXT.notes),
              density,
              title: "범용 악곡",
              chartAccuracy: "generic",
              noteTimeline: [],
              skillTimeline: [],
              fever: null,
            };
          }'''
          replace_once("js/score.js", old_context, new_context)

          old_project = '''function projectSong(unitScore, members, music, difficulty, fullSupportPct, playMode = "auto") {
            if (!music) return null;
            const selected = contextFromMusic(music, difficulty);
            const generic = contextFromMusic(null, difficulty);
            const selectedExpected = songSkillMultiplier(members, selected, fullSupportPct);
            const genericExpected = songSkillMultiplier(members, generic, fullSupportPct);
            const selectedMaximum = songSkillMultiplier(members, selected, fullSupportPct, true);
            const manual = playMode === "manual";
            const selectedKernel = selected.notes * selected.coefficient * (manual ? selected.comboMultiplier : 1);
            const genericKernel = generic.notes * generic.coefficient * (manual ? generic.comboMultiplier : 1);
            const baseRatio = genericKernel > 0 ? selectedKernel / genericKernel : 1;
            const skillRatio = genericExpected.skillMultiplier > 0
              ? selectedExpected.skillMultiplier / genericExpected.skillMultiplier
              : 1;
            const maxSkillRatio = genericExpected.skillMultiplier > 0
              ? selectedMaximum.skillMultiplier / genericExpected.skillMultiplier
              : 1;
            const averageScore = Math.max(0, Math.round(unitScore * baseRatio * skillRatio));
            const maxScore = Math.max(averageScore, Math.round(unitScore * baseRatio * maxSkillRatio));
            return {
              averageScore,
              maxScore,
              baseRatio,
              skillRatio,
              maxSkillRatio,
              context: selected,
              playMode: manual ? "manual" : "auto",
              expected: selectedExpected,
              maximum: selectedMaximum,
              note: manual
                ? "Manual FC 근사: 집계 노트의 콤보 보너스를 포함합니다."
                : "AUTO 근사: 프로토타입과 같이 콤보 보너스를 제외합니다.",
            };
          }'''
          new_project = '''function projectSong(unitScore, members, music, difficulty, fullSupportPct, playMode = "auto") {
            if (!music) return null;
            const selected = contextFromMusic(music, difficulty);
            const generic = contextFromMusic(null, difficulty);
            const scoreRules = music?._scoreRules ?? null;
            const genericExpected = songSkillMultiplier(members, generic, fullSupportPct);
            if (selected.chartAccuracy === "exact" && selected.noteTimeline.length) {
              return timelineSongProjection({
                unitScore,
                members,
                context: selected,
                genericContext: generic,
                fullSupportPct,
                playMode,
                genericSkillMultiplier: genericExpected.skillMultiplier,
                scoreRules,
              });
            }
            const selectedExpected = songSkillMultiplier(members, selected, fullSupportPct);
            const selectedMaximum = songSkillMultiplier(members, selected, fullSupportPct, true);
            const manual = playMode === "manual";
            const selectedKernel = songKernel(selected, playMode, scoreRules);
            const genericKernel = songKernel(generic, playMode, scoreRules);
            const baseRatio = genericKernel > 0 ? selectedKernel / genericKernel : 1;
            const skillRatio = genericExpected.skillMultiplier > 0
              ? selectedExpected.skillMultiplier / genericExpected.skillMultiplier
              : 1;
            const maxSkillRatio = genericExpected.skillMultiplier > 0
              ? selectedMaximum.skillMultiplier / genericExpected.skillMultiplier
              : 1;
            const averageScore = Math.max(0, Math.round(unitScore * baseRatio * skillRatio));
            const maxScore = Math.max(averageScore, Math.round(unitScore * baseRatio * maxSkillRatio));
            return {
              averageScore,
              maxScore,
              baseRatio,
              skillRatio,
              maxSkillRatio,
              context: selected,
              playMode: manual ? "manual" : "auto",
              expected: selectedExpected,
              maximum: selectedMaximum,
              specialWindows: [],
              note: selected.chartAccuracy === "master"
                ? "Master의 실제 풀콤보 노트 수를 사용하고, SP 타이밍은 집계 기반으로 근사합니다."
                : manual
                  ? "Manual FC 근사: 추정 노트와 콤보 보너스를 포함합니다."
                  : "AUTO 근사: 추정 노트 수를 사용하고 콤보 보너스를 제외합니다.",
            };
          }'''
          replace_once("js/score.js", old_project, new_project)

          # app.js: lazy-load selected chart, use master-only stage 1, then exact order refinement.
          replace_once(
              "js/app.js",
              'import { loadAppData, loadManifest } from "./data.js?v=20260812.2";\nimport { createStore } from "./state.js?v=20260812.2";\nimport { optimizeOwnedDeck } from "./recommend.js?v=20260812.2";\nimport { prepareScoreCards } from "./score.js?v=20260812.2";',
              'import { loadAppData, loadManifest } from "./data.js?v=20260812.2";\nimport { loadChartResources, loadSelectedChart } from "./chart-data.js?v=20260812.4";\nimport { createStore } from "./state.js?v=20260812.2";\nimport { optimizeOwnedDeck } from "./recommend.js?v=20260812.4";\nimport { optimizeRecommendationOrders } from "./order.js?v=20260812.4";\nimport { prepareScoreCards } from "./score.js?v=20260812.4";',
          )
          replace_once("js/app.js", 'import { renderResult } from "./ui/result.js?v=20260812.1";', 'import { renderResult } from "./ui/result.js?v=20260812.4";')
          replace_once("js/app.js", 'const APP_VERSION = "20260812.3";', 'const APP_VERSION = "20260812.4";')
          replace_once(
              "js/app.js",
              '  const data = localizeAppData(await loadAppData(manifest));',
              '  const data = localizeAppData(await loadAppData(manifest));\n  const chartResources = await loadChartResources(manifest);',
          )
          old_calc = '''    const preparedCards = prepareScoreCards(data.cards, data.charactersById, state.ownedCardSettings, {
              levelMode: state.levelMode,
            });
            const result = optimizeOwnedDeck({
              preparedCards,
              ownedCardIds: state.ownedCardIds,
              currentMembers: state.members,
              lockedSlots: state.lockedSlots,
              music: state.musicId ? data.musicById.get(state.musicId) : null,
              difficulty: state.difficulty,
              playMode: state.playMode,
              simulationTarget: state.simulationTarget,
              separateRole: state.separateRole,
              resultCount: RESULT_COUNT,
            });'''
          new_calc = '''    const preparedCards = prepareScoreCards(data.cards, data.charactersById, state.ownedCardSettings, {
              levelMode: state.levelMode,
            });
            const song = state.musicId ? data.musicById.get(state.musicId) : null;
            const chart = song ? await loadSelectedChart(chartResources, song.id, state.difficulty) : null;
            const exactMusic = song ? { ...song, _chart: chart, _scoreRules: chartResources.scoreRules } : null;
            const searchChart = chart ? { ...chart, metadata: null } : null;
            const searchMusic = song ? { ...song, _chart: searchChart, _scoreRules: chartResources.scoreRules } : null;
            const hasExactOrder = Boolean(chart?.metadata?.skills?.length);
            let result = optimizeOwnedDeck({
              preparedCards,
              ownedCardIds: state.ownedCardIds,
              currentMembers: state.members,
              lockedSlots: state.lockedSlots,
              music: searchMusic,
              difficulty: state.difficulty,
              playMode: state.playMode,
              simulationTarget: state.simulationTarget,
              separateRole: state.separateRole,
              resultCount: hasExactOrder ? Math.min(10, RESULT_COUNT * 2) : RESULT_COUNT,
            });
            if (result.ok) {
              result = optimizeRecommendationOrders({
                recommendation: result,
                preparedCards,
                currentMembers: state.members,
                lockedSlots: state.lockedSlots,
                music: exactMusic,
                difficulty: state.difficulty,
                playMode: state.playMode,
                simulationTarget: state.simulationTarget,
                separateRole: state.separateRole,
                resultCount: RESULT_COUNT,
              });
            }'''
          replace_once("js/app.js", old_calc, new_calc)

          # Result UI: show chart accuracy and exact SP order windows.
          for lang, old, new in [
              ("ko", '    songMeta: (duration, notes, mode) => `${duration}초 · 약 ${notes}노트 · ${mode === "auto" ? "AUTO (콤보 보너스 없음)" : "Manual FC"}`,', '    songMeta: (duration, notes, mode, accuracy) => `${duration}초 · ${accuracy === "estimated" ? "약 " : ""}${notes}노트 · ${mode === "auto" ? "AUTO (콤보 보너스 없음)" : "Manual FC"}`,\n    chartExact: "실제 채보 노트·SP 순서 반영",\n    chartMaster: "Master 풀콤보 노트 수 반영 · SP 타이밍 근사",\n    chartEstimated: "노트 밀도 추정",\n    specialTimeline: "스페셜 스킬 발동 순서",'),
              ("en", '    songMeta: (duration, notes, mode) => `${duration}s · approx. ${notes} notes · ${mode === "auto" ? "AUTO (no combo bonus)" : "Manual FC"}`,', '    songMeta: (duration, notes, mode, accuracy) => `${duration}s · ${accuracy === "estimated" ? "approx. " : ""}${notes} notes · ${mode === "auto" ? "AUTO (no combo bonus)" : "Manual FC"}`,\n    chartExact: "Exact chart notes and SP order applied",\n    chartMaster: "Master full-combo note count applied · SP timing approximated",\n    chartEstimated: "Estimated from note density",\n    specialTimeline: "Special Skill Order",'),
              ("ja", '    songMeta: (duration, notes, mode) => `${duration}秒 · 約${notes}ノーツ · ${mode === "auto" ? "AUTO（コンボボーナスなし）" : "Manual FC"}`,', '    songMeta: (duration, notes, mode, accuracy) => `${duration}秒 · ${accuracy === "estimated" ? "約" : ""}${notes}ノーツ · ${mode === "auto" ? "AUTO（コンボボーナスなし）" : "Manual FC"}`,\n    chartExact: "実譜面ノーツ・SP順序を反映",\n    chartMaster: "Masterのフルコンボ数を反映 · SP時刻は近似",\n    chartEstimated: "ノーツ密度から推定",\n    specialTimeline: "スペシャルスキル発動順",'),
          ]:
              replace_once("js/ui/result.js", old, new)

          old_song_ui = '''function songProjection(score, song, difficulty) {
            const projection = score.songProjection;
            if (!projection || !song) {
              return `<div class="song-projection is-generic"><strong>${t("music.average")}</strong><span>${escapeHtml(copy().genericEvaluation)}</span></div>`;
            }
            return `
              <div class="song-projection">
                <div class="song-projection-score"><span>${escapeHtml(copy().selectedSongAverage)}</span><strong>${formatNumber(projection.averageScore)}</strong></div>
                <div class="song-projection-score"><span>${escapeHtml(copy().allActiveMaximum)}</span><strong>${formatNumber(projection.maxScore)}</strong></div>
                <p><b>${escapeHtml(song.title)} · ${escapeHtml(difficulty)}</b><span>${escapeHtml(copy().songMeta(projection.context.duration, formatNumber(projection.context.notes), projection.playMode))}</span></p>
              </div>`;
          }'''
          new_song_ui = '''function specialSkillTimeline(projection) {
            const windows = projection?.specialWindows ?? [];
            if (!windows.length) return "";
            return `<div class="special-skill-order"><strong>${escapeHtml(copy().specialTimeline)}</strong><ol>${windows.map((window) => `<li><b>SP ${window.slot}</b><span>${escapeHtml(window.characterName)} · ${formatSeconds(window.start)}–${formatSeconds(window.end)}</span></li>`).join("")}</ol></div>`;
          }

          function songProjection(score, song, difficulty) {
            const projection = score.songProjection;
            if (!projection || !song) {
              return `<div class="song-projection is-generic"><strong>${t("music.average")}</strong><span>${escapeHtml(copy().genericEvaluation)}</span></div>`;
            }
            const accuracy = projection.context.chartAccuracy ?? "estimated";
            const accuracyText = accuracy === "exact" ? copy().chartExact : accuracy === "master" ? copy().chartMaster : copy().chartEstimated;
            return `
              <div class="song-projection">
                <div class="song-projection-score"><span>${escapeHtml(copy().selectedSongAverage)}</span><strong>${formatNumber(projection.averageScore)}</strong></div>
                <div class="song-projection-score"><span>${escapeHtml(copy().allActiveMaximum)}</span><strong>${formatNumber(projection.maxScore)}</strong></div>
                <p><b>${escapeHtml(song.title)} · ${escapeHtml(difficulty)}</b><span>${escapeHtml(copy().songMeta(projection.context.duration, formatNumber(projection.context.notes), projection.playMode, accuracy))}</span></p>
                <p class="song-projection-accuracy"><span>${escapeHtml(accuracyText)}</span></p>
                ${specialSkillTimeline(projection)}
              </div>`;
          }'''
          replace_once("js/ui/result.js", old_song_ui, new_song_ui)

          append_once("css/components.css", ".special-skill-order {", '''
          .special-skill-order {
            grid-column: 1 / -1;
            margin-top: 10px;
            padding: 12px 14px;
            border: 1px solid var(--accent-line);
            border-radius: var(--radius-sm);
            background: var(--accent-soft);
          }

          .special-skill-order > strong { color: var(--accent-ink); }
          .special-skill-order ol {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
          }
          .special-skill-order li {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--surface);
          }
          .special-skill-order li b { color: var(--brand); white-space: nowrap; }
          .special-skill-order li span { color: var(--ink-700); font-size: 0.88rem; }
          .song-projection-accuracy { grid-column: 1 / -1; margin-top: 4px; color: var(--ink-650); font-size: 0.85rem; }
          ''')

          # Cache/version wiring.
          replace_once("index.html", 'data-app-version="20260812.3"', 'data-app-version="20260812.4"')
          replace_once("index.html", './styles.css?v=20260812.5', './styles.css?v=20260812.6')
          replace_once("index.html", './js/app.js?v=20260812.3', './js/app.js?v=20260812.4')
          replace_once("styles.css", './css/components.css?v=20260812.5', './css/components.css?v=20260812.6')

          # CI/Pages always regenerate master chart index + score rules.
          for workflow in [".github/workflows/validate.yml", ".github/workflows/pages.yml"]:
              p = Path(workflow)
              text = p.read_text(encoding="utf-8")
              text = text.replace("node scripts/build-i18n.mjs", "node scripts/build-i18n.mjs\n          node scripts/build-chart-index.mjs")
              marker = "find js -name '*.js' -print0 | xargs -0 -n1 node --check"
              if marker in text:
                  text = text.replace(marker, marker + "\n          node --check scripts/build-chart-index.mjs\n          python -m py_compile scripts/ingest-chart-metadata.py", 1)
              p.write_text(text, encoding="utf-8")

          append_once("README.md", "## 실제 채보 타임라인", '''
          ## 실제 채보 타임라인

          악곡/난이도별 `MusicDifficultyChart`와 `MusicDifficulty`를 기반으로 `data/generated/chart-index.json`을 생성합니다. 이 인덱스가 있으면 실제 풀콤보 노트 수를 사용하며, 추출한 Holodori `.sus` 채보를 `scripts/ingest-chart-metadata.py`로 변환해 `data/generated/charts/`에 추가하면 노트별 시각/종류, SP 슬롯 발동 시각, Fever 구간까지 계산에 반영합니다.

          ```bash
          node scripts/build-chart-index.mjs
          pip install git+https://github.com/HolodoriDB/holodori-scores.git
          python scripts/ingest-chart-metadata.py path/to/chart_m0001_expert.sus
          node scripts/build-chart-index.mjs
          ```

          정확한 채보 메타데이터가 있는 악곡은 추천 조합 상위 후보에 대해 잠긴 멤버 슬롯을 유지한 채 남은 슬롯 순열을 재평가하여 SP 발동 순서까지 최적화합니다. 채보 파일이 없는 경우에는 Master의 실제 풀콤보 노트 수를 사용하고 기존 집계형 SP 계산을 fallback으로 유지합니다.
          ''')

          append_once("LOCAL_TEST.md", "### Chart timeline data", '''
          ### Chart timeline data

          ```bash
          node scripts/build-chart-index.mjs
          node --check js/chart-data.js
          node --check js/chart-score.js
          node --check js/order.js
          python -m py_compile scripts/ingest-chart-metadata.py
          ```

          실제 `.sus` 채보를 확보한 경우 `python scripts/ingest-chart-metadata.py <chart.sus>` 실행 후 `node scripts/build-chart-index.mjs`를 다시 실행해 `metadataPath`를 등록합니다.
          ''')
          PY
      - name: Generate master chart data
        run: node scripts/build-chart-index.mjs
      - name: Syntax check
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/build-chart-index.mjs
          python -m py_compile scripts/ingest-chart-metadata.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-chart-timeline-patch.yml
          git add js css scripts data/generated/chart-index.json data/generated/live-score-rules.json index.html styles.css README.md LOCAL_TEST.md .github/workflows/validate.yml .github/workflows/pages.yml
          git commit -m "Integrate chart timeline scoring and SP order optimization"
          git push origin HEAD:feat/chart-timeline-scoring
