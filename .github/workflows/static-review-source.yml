name: Static optimization source snapshot
on:
  push:
    branches: [perf/static-data-rendering]
    paths: [.github/workflows/static-review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git archive --format=tar HEAD -o /tmp/holodori-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: holodori-source
          path: /tmp/holodori-source.tar
          retention-days: 2
