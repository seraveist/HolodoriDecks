name: Restore dry-run Master candidate
description: Check out the exact candidate commit transferred by a preceding sync job
inputs:
  artifact:
    description: Name of the Git bundle artifact from this workflow run
    required: true
  sha:
    description: Expected candidate commit SHA
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/master-sync-candidate
    - name: Verify and check out candidate
      shell: bash
      env:
        EXPECTED_HEAD: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        bundle="$RUNNER_TEMP/master-sync-candidate/master-candidate.bundle"
        base="$(git rev-parse HEAD)"
        git bundle verify "$bundle"
        git fetch --no-tags "$bundle" HEAD
        test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
        test "$(git rev-parse FETCH_HEAD^)" = "$base"
        git switch --detach "$EXPECTED_HEAD"
