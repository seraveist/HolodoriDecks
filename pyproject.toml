[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "holodori-decksim"
version = "1.1.3"
description = "Hololive Dreams deck simulator master-data synchronization tools"
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8"]
music-search = ["hunmin[cjk]==3.44.1"]

[project.scripts]
holodori-sync = "holodori_decksim.sync:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
