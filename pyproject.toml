[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "holodori-decksim"
version = "0.1.0"
description = "Hololive Dreams deck simulator and master-data sync tools"
requires-python = ">=3.11"

[project.optional-dependencies]
assets = ["Pillow>=12"]

[project.scripts]
holodori-sync = "holodori_decksim.sync:main"
holodori-assets = "holodori_decksim.assets:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
